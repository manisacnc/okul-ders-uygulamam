"## Kesir Nedir?\nBir bütünün eş parçalarından kaç tanesini aldığımızı gösterir: pay / payda.\n- 3/4: bütün 4 eş parçaya bölünmüş, 3 parçası alınmış.\n- Payda 0 olamaz.\n## Toplama ve Çıkarma\nPaydalar eşitse paylar toplanır/çıkarılır, payda aynı kalır.\n- 2/5 + 1/5 = 3/5\nPaydalar farklıysa önce genişletilerek paydalar eşitlenir.\n- 1/2 + 1/4 = 2/4 + 1/4 = 3/4\n## Çarpma\nPaylar çarpılır, paydalar çarpılır.\n- 2/3 × 3/4 = 6/12 = 1/2 (sadeleştirme!)\n## Bölme\nİlk kesir aynı kalır, ikinci kesir ters çevrilir ve çarpılır.\n- 3/4 ÷ 2/5 = 3/4 × 5/2 = 15/8\n## Tam Sayılı Kesir\nTam kısımlı kesirdir: 1 1/2 = 3/2 (tam × payda + pay).\n💡 Çarpma öncesi sadeleştirme işlemi kolaylaştırır.",

// 5 Ondalık Gösterim
"## Ondalık Gösterim\nVirgülle ayrılmış kesir gösterimidir. Virgülün sağı ondalık kısım, solu tam kısımdır.\n- 3,25 → 3 tam, 25 yüzde birlik.\n## Kesir ↔ Ondalık Dönüşüm\n- 1/2 = 0,5 ; 3/4 = 0,75 ; 1/5 = 0,2\n- Paydayı 10, 100, 1000'e genişletmek kolay yol: 3/4 → 75/100 → 0,75\n## Toplama ve Çıkarma\nVirgüller alt alta getirilir; eksik basamaklara 0 eklenir.\n- 3,2 + 1,45 = 3,20 + 1,45 = 4,65\n## Çarpma\nNormal çarpılır, sonra virgülle ayrılan toplam basamak sayısı kadar sağdan virgül kaydırılır.\n- 2,5 × 1,2 = 3,00 → 3\n- 10, 100, 1000 ile çarpım: virgül sağa kayar. 4,56 × 10 = 45,6\n## Bölme\n- 10, 100, 1000 ile bölümde virgül sola kayar: 45,6 ÷ 10 = 4,56\n- Ondalıklı bölen varsa virgüllerden kurtuluruz: 1,5 ÷ 0,5 = 15 ÷ 5 = 3\n## Yuvarlama\nİstenen basamağa bak: sağdaki rakam 5 ve üzeriyse yukarı yuvarla.\n- 4,56 ondalıkları yuvarla → 4,6 ; 4,54 → 4,5\n✏️ Ondalık sıralarken önce tam kısma, eşitse ondalık basamaklara sırayla bak.",

// 6 Oran
"## Oran Nedir?\nİki çokluğun kesir biçiminde karşılaştırılmasıdır. a/b veya a:b şeklinde gösterilir.\n- Sınıfta 12 kız, 18 erkek varsa kız/erkek oranı = 12/18 = 2/3\n## Birimli Oran\nBirimleri farklıdır (km/sa, TL/kg): \"aracın hızı 80 km/sa\".\n## Birimsiz Oran\nAynı tür çoklukların oranıdır, birimi yoktur: \"kız sayısı / erkek sayısı\".\n## Eşit Oranlar (Oran Orantı)\nOranlar sadeleştirilip genişletilerek eşitlenebilir.\n- 1/2 = 2/4 = 3/6 ... eşit oranlardır.\n💡 Oran çoklukların sırasına dikkat et: \"a'nın b'ye oranı\" yazıldığı sırayla kurulur.",

// 7 Cebirsel İfadeler
"## Değişken, Terim ve Katsayı\n- Değişken (bilinmeyen): Değeri bilinmeyen, harfle gösterilen sayı: x, y, a.\n- Terim: Toplama/çıkarmayla ayrılan her parça: 2x + 5 → iki terim (2x ve 5).\n- Katsayı: Terimin sayı kısmı: 2x'te katsayı 2, x'te 1'dir.\n- Sabit terim: Değişkeni olmayan terim: 2x + 5'te 5.\n## Benzer Terimler\nDeğişkeni aynı olan terimlerdir; birleştirilir.\n- 3x + 2x = 5x\n- 4a − a = 3a\n- x² ile x benzer değildir.\n## İfadenin Değeri\nDeğişkene değer vererek hesaplanır: 2x + 5, x = 3 için → 2·3 + 5 = 11.\n✏️ Katsayısı yazılmayan x'in katsayısı 1'dir; −x'in katsayısı −1'dir.",

// 8 Veri Analizi
"## Aritmetik Ortalama\nTüm değerler toplanır, değer sayısına bölünür.\n- Veriler: 4, 6, 8 → ortalama = (4+6+8) ÷ 3 = 18 ÷ 3 = 6\n## Mod (Tepe Değer)\nEn çok tekrar eden değerdir.\n- Veriler: 3, 3, 5, 7, 7, 7 → mod = 7\n- Tüm değerler farklıysa mod yoktur; iki değer aynı sıklıktaysa çift mod olabilir.\n## Medyan (Ortanca)\nVeriler küçükten büyüğe sıralanır; ortadaki değerdir.\n- Tek sayıda veri: ortanca tam ortadaki: 3, 5, 8 → medyan 5\n- Çift sayıda veri: ortadaki iki değerin ortalaması: 3, 5, 8, 10 → (5+8)÷2 = 6,5\n## Açıklık\nEn büyük değer ile en küçük değer arasındaki farktır.\n- Veriler: 2, 5, 9 → açıklık = 9 − 2 = 7\n💡 Önce verileri sırala; medyan ve açıklık için bu şarttır.",

// 9 Açılar
"## Açı Nedir?\nBir noktadan (köşe) çıkan iki ışının oluşturduğu şekildir. Birimi derecedir (°).\n## Açı Türleri\n- Dar açı: 0° < a < 90°\n- Dik açı: 90°\n- Geniş açı: 90° < a < 180°\n- Doğru açı: 180°\n- Tam açı: 360°\n## Komşu Açılar\nKöşeleri ve birer kolları ortak olan, iç bölgeleri ortak olmayan açılardır.\n## Tümler Açılar\nÖlçüleri toplamı 90° olan iki açıdır.\n- 30° ile 60° tümlerdir. Birinin ölçüsü 90° − diğeri.\n## Bütünler Açılar\nÖlçüleri toplamı 180° olan iki açıdır.\n- 30° ile 150° bütünlerdir. Birinin ölçüsü 180° − diğeri.\n✏️ Tümler = 90 (T harfinde 1 dik açı), Bütünler = 180 (B harfinde 1 doğru gibi dümdüz).",

// 10 Alan Ölçme
"## Alan Nedir?\nBir yüzeyin kapladığı bölgedir. Birim kare cinsinden ölçülür (cm², m²).\n## Paralelkenarın Alanı\nAlan = Taban × Yükseklik (A = a × h).\n- Tabanı 8 cm, yüksekliği 5 cm olan paralelkenarın alanı = 8 × 5 = 40 cm²\n💡 Paralelkenarda yükseklik, tabana dik inen uzaklıktır; kenar değil!\n## Üçgenin Alanı\nAlan = Taban × Yükseklik ÷ 2 (A = a × h ÷ 2).\n- Tabanı 10 cm, yüksekliği 6 cm olan üçgenin alanı = 10 × 6 ÷ 2 = 30 cm²\n- Dik üçgende taban ve yükseklik dik kenarlardır.\n## Alan Birimleri\n1 m² = 100 dm² = 10 000 cm². Dönüşümde 100 ile çarpılır/bölünür.\n✏️ Üçgenin alanını bulurken 2'ye bölmeyi unutma! Paralelkenar, iki eş üçgenden oluşur.",

// 11 Çember
"## Çember ve Daire\n- Çember: Merkezden eşit uzaklıktaki noktaların oluşturduğu kapalı eğridir (içi boş).\n- Daire: Çemberin sınırladığı bölgenin tamamı (içi dolu).\n## Yarıçap ve Çap\n- Yarıçap (r): merkezden çembere çizilen doğru parçası.\n- Çap (R): çemberin bir noktasından merkezden geçerek karşı noktaya uzanan doğru parçası. Çap = 2 × yarıçap.\n## Çevre Hesaplama\nÇevre = 2 × π × r veya π × çap.\n- π (pi) yaklaşık 3,14'tür (5. sınıfta ≈ 3 kullanılır).\n- r = 5 cm ise çevre ≈ 2 × 3 × 5 = 30 cm\n## Çember Çizme\nPergel: Ucu merkeze konur, kalem kısmı yarıçap kadar açılarak çizilir.\n✏️ Yarıçap verilirse çapı bulmak için 2 ile çarp; çap verilirse yarıçapı bulmak için 2'ye böl.",

// 12 Geometrik Cisimler
"## Dik Prizmalar\nTabanları birbirine paralel ve eş çokgenler; yan yüzleri dikdörtgen olan cisimlerdir.\n- Kare prizma, dikdörtgenler prizması, üçgen prizma, beşgen prizma...\n## Yüz, Ayrıt, Köşe\n- Yüz: Prizmayı sınırlayan yüzeyler.\n- Ayrıt: İki yüzün kesiştiği doğru parçası.\n- Köşe: Ayrıtların kesiştiği nokta.\n- Dikdörtgenler prizması: 6 yüz, 12 ayrıt, 8 köşe.\n- Kare prizma: 6 yüz, 12 ayrıt, 8 köşe (2 kare + 4 dikdörtgen yüz).\n- Üçgen prizma: 5 yüz, 9 ayrıt, 6 köşe.\n## Yüzey Açınımı\nPrizmanın açılımı, tüm yüzlerin aynı düzlemde çizilmiş halidir.\n## Hacim Kavramı\nPrizmanın içini kaç birim küp doldurur: hacim = taban alanı × yükseklik.\n💡 Dikdörtgenler prizması için hacim = a × b × c (uzunluk × genişlik × yükseklik).",

// 13 Sıvı Ölçme
"## Sıvı Ölçme Birimleri\n- Temel birim: litre (L).\n- Alt birim: mililitre (mL).\n- 1 L = 1000 mL\n- 0,5 L = 500 mL\n## Birim Çevirme\nLitre → mililitre: 1000 ile çarp. Mililitre → litre: 1000'e böl.\n- 2,5 L = 2500 mL\n- 750 mL = 0,75 L\n## Sıvı – Hacim İlişkisi\n1 L su, 1000 cm³ hacim kaplar. Bu yüzden sıvı ölçüleri hacimle ilişkilendirilir.\n- 1 L = 1 dm³\n## Sıvı Problemleri\nKaplara bölüştürme, karışım ve doldurma problemlerinde mL/L dönüşümüne dikkat edilir.\n✏️ \"1 L suyu 4 eş bardağa eşit paylaştır\" → her bardak 1000 ÷ 4 = 250 mL.",

// 14 Hacim Ölçme
"## Birim Küp\nKenarı 1 birim olan küptür; hacim ölçmede temel birimdir.\n## Dikdörtgenler Prizmasının Hacmi\nHacim = Taban alanı × Yükseklik = a × b × c.\n- 2 × 3 × 4 boyutlarındaki prizma 24 birim küp alır.\n## Hacim Birimleri\n- cm³, m³, dm³.\n- 1 m³ = 1 000 000 cm³\n- 1 dm³ = 1 L (sıvı ile ilişki!)\n## Hacim Problemleri\nPrizma hacmi bulunup bölüştürme, doldurma ve taşırma problemleri çözülür.\n✏️ Hacim hesaplarken üç boyutu da çarp; uzunluk, genişlik ve yüksekliği aynı birimde kullan.",

// 15 Veri Toplama ve Değerlendirme
"## Araştırma Sorusu\nCevabı kişiden kişiye değişen, birden çok cevaplı sorudur: \"Sınıfın en sevdiği meyve hangisidir?\"\n💡 \"Herkesin boyu kaç cm?\" araştırma sorusu; \"Ali'nin boyu kaç?\" araştırma sorusu değildir (tek cevap).\n## Veri Toplama\nAnket, ölçüm ve gözlemle veriler toplanır; düzenlenir.\n## Tablolar\n- Sıklık tablosu: veri değerlerini ve kaç kez tekrar ettiğini gösterir.\n- Sütun ve çizgi grafikleri: veriyi görselleştirir.\n## Grafik Yorumlama\nGrafikten en çok/en az, toplam, fark ve oran çıkarımları yapılır.\n✏️ Veri toplamadan önce araştırma sorusunu net yaz; soruya uygun olmayan verileri eler."
],

/* ===================== FEN BİLİMLERİ ===================== */
fen6: [
// 0 Güneş Sistemi ve Tutulmalar
"## Güneş Sistemi\nGüneş'in etrafında dolanan 8 gezegen ve gök cisimlerinin tamamıdır.\nGüneş'e yakınlık sırası: Merkür, Venüs, Dünya, Mars, Jüpiter, Satürn, Uranüs, Neptün.\n- İç gezegenler: Merkür, Venüs, Dünya, Mars (kayalık)\n- Dış gezegenler: Jüpiter, Satürn, Uranüs, Neptün (gaz devleri)\n💡 Hatırlatma: \"Mavi Vapur Durmadan Mars'a Jüpiter'i Söylerdi Uranüs Neptün\" → sıra ezberlenir.\n## Gök Taşları ve Kuyruklu Yıldızlar\n- Meteor (gök taşı): uzaydan atmosfere giren kaya parçası; Dünya'ya ulaşanına gök taşı denir.\n- Kuyruklu yıldız: Güneş'e yaklaştıkça kuyruğu oluşan buzlu gök cismi.\n## Güneş Tutulması\nAy, Güneş ile Dünya arasına girer; Ay'ın gölgesi Dünya'ya düşer. Gündüz yaşanır.\n## Ay Tutulması\nDünya, Güneş ile Ay arasına girer; Ay'ın üzerine Dünya'nın gölgesi düşer. Gece yaşanır.\n✏️ Güneş tutulması yeni ay evresinde, Ay tutulması dolunay evresinde gerçekleşir.",

// 1 Vücudumuzdaki Sistemler
"## Destek ve Hareket Sistemi\nVücuda şekil verir, organları korur ve hareketi sağlar.\n- İskelet: kemiklerden oluşur. Kafatası, omurga, göğüs kafesi, kol-bacak kemikleri.\n- Eklem: kemiklerin birleştiği yerler (oynar, yarı oynar, oynamaz).\n- Kaslar: iskeletle birlikte hareketi sağlar (düz kas, çizgili kas, kalp kası).\n## Dolaşım Sistemi\nKanı vücuda pompalar; besin ve oksijeni taşır.\n- Kalp: kanı pompalayan organ.\n- Kan damarları: atardamar (kalpten), toplardamar (kalbe), kılcal damar.\n- Kan: alyuvar, akyuvar, kan pulcukları ve plazmadan oluşur.\n💡 Kalp kası, çizgili kastır ama istemsiz çalışır; ömrümüz boyunca durmadan atar.",

// 2 Kuvvet ve Hareket
"## Kuvvet Nedir?\nBir cisme etki eden, onu hareket ettirebilen, durdurabilen ya da şeklini değiştirebilen etkidir.\n- Kuvvet bir vektördür: büyüklüğü ve yönü vardır. Birimi Newton (N), dinamometreyle ölçülür.\n## Bileşke Kuvvet\nAynı yöndeki kuvvetler toplanır, zıt yöndekiler çıkarılır.\n- Aynı yönde: F₁ + F₂ (hareketi hızlandırır)\n- Zıt yönde: |F₁ − F₂| (büyük olan yönde)\n## Dengelenmiş ve Dengelenmemiş Kuvvet\n- Dengelenmiş: bileşke kuvvet 0'dır; cisim duruyorsa durur, sabit hızla gidiyorsa devam eder.\n- Dengelenmemiş: bileşke 0 değildir; cisim hızlanır ya da yavaşlar.\n## Sürtünme Kuvveti\nHarekete karşı koyan, cisimle yüzey arasındaki kuvvettir.\n- Cismi yavaşlatır, pürüzlü yüzeylerde daha büyüktür.\n- Hava ve su direnci de bir tür sürtünmedir (paraşüt, balık şekli).\n✏️ Bileşke kuvvet sıfır değilse cisim mutlaka hızlanır ya da yavaşlar — yön değiştirebilir.",

// 3 Madde ve Isı
"## Maddelerin Tanecikli Yapısı\nBütün maddeler gözle görülemeyen, boşluklu, hareketli taneciklerden oluşur.\n- Tanecikler arası boşluk: gaz > sıvı > katı\n- Tanecik hareketliliği de aynı sırayla fazladır.\n## Isı ve Sıcaklık\n- Isı: sıcaklıkları farklı maddeler arasında aktarılan enerjidir (kalori veya joule ile ölçülür).\n- Sıcaklık: bir maddenin taneciklerinin ortalama hareket enerjisinin göstergesidir (°C termometreyle).\n💡 Isı bir enerji çeşididir, maddeyi oluşturmaz; sıcaklık ise ölçümdür.\n## Isı Alışverişi\nSıcak maddeden soğuk maddeye doğru olur; dengeye ulaşınca sona erer.\n## Genleşme ve Büzülme\n- Genleşme: ısınan maddenin hacminin artması (kavanoz kapağı sıcak suda açılır).\n- Büzülme: soğuyan maddenin hacminin azalması.\n- Katı-sıvı genel olarak genleşir; su 4°C'den soğurken büzülür (buz suda yüzer).",
// 4 Ses ve Özellikleri
"## Ses Nasıl Oluşur?\nSes, maddelerin titreşmesiyle oluşur. Titreşen kaynak, çevresindeki tanecikleri titreştirerek sesi yayar.\n- Ses kaynağı titreşmezse ses oluşmaz.\n## Sesin Yayılması\nSes, katı, sıvı ve gaz ortamlarda yayılır; boşlukta yayılamaz!\n- Hız: katı > sıvı > gaz (tanecikler ne kadar yakınsa o kadar hızlı).\n- Yüksek ve alçak yerlerde yankı, sesin yansımasıdır.\n## Frekans (Yükseklik)\nSesin ince-kalınlığıdır. Yüksek frekans → ince ses, düşük frekans → kalın ses.\n- Sesin yüksekliği kaynağın titreşim sayısına bağlıdır.\n## Genlik (Gürlük)\nSesin şiddetidir; ses kaynağının titreşim genliğine bağlıdır.\n- Büyük genlik → gür (yüksek) ses, küçük genlik → kısık ses.\n- Genliği enerjiye, frekansı yüksekliğe bağla.\n✏️ Gürlük \"ses şiddeti\"dir (kaç dB), yükseklik \"ince-kalın\"dır — karıştırma.",

// 5 Vücudumuzdaki Sistemler ve Sağlığı
"## Solunum Sistemi\nOksijeni alıp karbondioksiti dışarı verir.\n- Burun, yutak, gırtlak, soluk borusu, akciğerler.\n- Alveoller (hava kesecikleri) gaz alışverişinin yapıldığı yerdir.\n## Boşaltım Sistemi\nKanı süzer, atık maddeleri (üre, fazla su) vücuttan uzaklaştırır.\n- Böbrekler (idrar üretimi), idrar borusu (üreter), idrar kesesi, idrar kanalı.\n- Deri ve akciğerler de boşaltıma yardımcı olur (ter, su buharı).\n## Denetleyici ve Düzenleyici Sistem\nSinirler ve iç salgı bezleri vücudun düzenini sağlar.\n- İç salgı bezleri hormon salgılar: büyüme, şeker düzenleme (pankreas) gibi görevler.\n## Sistemlerin Sağlığı\nDengeli beslenme, düzenli uyku, temizlik ve spor; sigaradan uzak durmak akciğer ve kalbi korur.\n💡 Böbrekler \"vücudun süzgeci\", kalp \"vücudun pompası\"dır; soluk borusu ile yemek borusunu karıştırma (gırtlak üstte).",

// 6 Elektrik İletkenliği
"## İletken ve Yalıtkan Maddeler\n- İletkenler: elektriği ileten maddeler (metaller: bakır, demir, altın; tuzlu su).\n- Yalıtkanlar: elektriği iletmeyen maddeler (plastik, ahşap, cam, kauçuk, saf su).\n## Devre Elemanları\nPil (enerji kaynağı), ampul (alıcı), anahtar (açıp kapama), bağlantı kabloları.\n- Devre kapalıysa ampul yanar.\n## Elektriksel İletkenlik Deneyi\nTest edilen madde devreye bağlanır; ampul yanıyorsa madde iletkendir.\n## Güvenlik Önlemleri\n- Islak elle elektrik düğmelerine dokunma (su iletkendir).\n- Yalıtkan eldiven ve kablolar kullanılır.\n- Prizlere metal cisim sokma; pili kısa devre yapma.\n💡 Saf su yalıtkandır ama tuzlu su iletkendir; ıslak eller iletkenliği artırır, tehlikeye yol açar."
],

/* ===================== SOSYAL BİLGİLER ===================== */
sos6: [
// 0 Biz ve Değerlerimiz
"## Sosyal Roller\nBireyin toplum içinde üstlendiği görev ve davranış kalıplarına sosyal rol denir.\n- Bir kişi aynı anda birden çok role sahiptir: öğrenci, evlat, kardeş, arkadaş.\n- Her rolün gerektirdiği sorumluluklar vardır.\n## Değerlerimiz\nBirlikte yaşamayı kolaylaştıran davranış ilkeleridir.\n- Yardımlaşma, dürüstlük, sorumluluk, hoşgörü, saygı, adalet.\n## Empati\nKendimizi karşımızdakinin yerine koyup onun duygularını anlamaya çalışmaktır.\n💡 \"Kendine yapılmasını istemediğini başkasına yapma\" en temel hoşgörü kuralıdır.\n## Sorumluluklarımız\nÖdevlerimizi yapmak, sözümüzde durmak, kurallara uymak hem bireysel hem toplumsal barışı güçlendirir.",

// 1 Kültür ve Miras
"## Orhun Yazıtları\nTürklerin bilinen ilk alfabeli yazılı eserleridir (8. yüzyıl).\n- Orhun Nehri çevresinde dikilmiştir (bugün Moğolistan).\n- Göktürk alfabesiyle yazılmış; Türk adının geçtiği ilk metinlerdir.\n- Kitabeler: Bilge Kağan, Kültigin, Tonyukuk.\n## İlk Türk Devletleri\nGöktürkler, Hunlar, Uygurlar... Devlet yönetimi, kağan, toy (kurultay) gibi kavramlar.\n## Anadolu Medeniyetleri\nHititler, Frigler, Urartular, Lidyalılar, İyonlar gibi uygarlıkların mirası.\n## Kültürel Miras\nTarihi yapılar, el sanatları, yemekler, türküler ve gelenekler kültürümüzü oluşturur.\n✏️ Yazının olmadığı dönemde tarih yazılı değil sözlü ve arkeolojik bulgularla öğrenilir; Orhun Yazıtları bu yüzden değerlidir.",

// 2 İnsanlar, Yerler ve Çevreler
"## Türkiye'nin Konumu\nTürkiye, Asya ile Avrupa'yı birbirine bağlayan köprü konumundadır.\n- Üç tarafı denizlerle çevrilidir; komşuları ve denizleriyle stratejik önem taşır.\n## Yeryüzü Şekilleri\nDağ, ova, plato, akarsu, göl gibi şekiller Türkiye'nin yüzeyini oluşturur.\n- Kuzey: Kuzey Anadolu Dağları; Güney: Toros Dağları.\n## Harita Okuma\nÖlçek, yön oku, lejant (işaretler anahtarı) ve renkler (mavi su, yeşil alçak, kahverengi yüksek).\n## İklim ve Yaşam\n- Karadeniz: bol yağışlı, yeşil.\n- Akdeniz: sıcak ve kurak yazlar.\n- İç Anadolu: karasal iklim (yaz sıcak, kış soğuk).\n💡 İklim, insanların giyimini, tarım ürünlerini, konut tipini ve yaşam biçimini doğrudan etkiler.",

// 3 Türk Tarihinde Yolculuk
"## Göçler\nTürkler, tarih boyunca Orta Asya'dan dünyanın farklı bölgelerine göç etmiştir.\n- Göç nedenleri: kuraklık, nüfus artışı, otlakların yetmemesi, savaşlar.\n- Göçlerle Türk kültürü geniş bir alana yayılmıştır.\n## İlk Türk Devletleri\nHunlar, Göktürkler, Uygurlar, Karahanlılar...\n- Kurultay (toy): devlet işlerinin görüşüldüğü meclis.\n- Kağan: devleti yöneten hükümdar; töre: yazısız hukuk kuralları.\n## İpek Yolu ve Baharat Yolu\nDoğu ile Batı arasında ticaret ve kültür alışverişini sağlayan yollardır.\n- İpek, kâğıt, baharat, din ve bilgi bu yollarla yayılmıştır.\n- Yollar üzerindeki devletler ticaretten büyük kazanç sağlamıştır.\n✏️ İpek Yolu yalnızca ticaret değil; bilgi, din ve kültür etkileşiminin de köprüsüdür.",

// 4 Yönetime Katılıyorum
"## Yönetim Biçimleri\n- Cumhuriyet: halkın seçtiği temsilciler yönetir; güç halktandır.\n- Monarşi: yönetimin tek kişide (kral, padişah) olduğu sistem.\n- Oligarşi: küçük bir grubun yönettiği sistem.\n## Parlamento ve Seçimler\n- TBMM (Türkiye Büyük Millet Meclisi): yasaları yapar.\n- Milletvekilleri, halkın oylarıyla belirli süre için seçilir.\n- Seçme ve seçilme hakkı, demokratik katılımın temelidir.\n## Demokrasinin İlkeleri\nEşitlik, özgürlük, adalet, halkın kendini yönetmesi.\n## Katılım Yolları\nOy kullanmak, sivil toplum kuruluşlarında çalışmak, dilekçe hakkı, meclis kararlarını izlemek.\n💡 Demokraside sadece seçmek değil; seçilmek, izlemek ve söz hakkı kullanmak da katılımdır.",

// 5 Bilim ve Teknolojinin Gelişimi
"## Önemli Buluşlar ve Etkileri\n- Yazının bulunuşu: bilgi birikiminin aktarılmasını sağladı.\n- Tekerlek: ulaşımı ve ticareti kolaylaştırdı.\n- Pusula: yön bulmayı sağladı, coğrafi keşifleri kolaylaştırdı.\n- Matbaa: bilginin hızlı ve ucuz yayılmasını sağladı.\n## Bilim ve Teknoloji İlişkisi\nBilim yeni bilgiler üretir; teknoloji bu bilgiyi hayatımıza uyarlar. İkisi birbirini besler.\n## Buluşların Topluma Etkileri\nBuluşlar üretimi artırır, işleri kolaylaştırır, yaşam kalitesini yükseltir; ama bilinçsiz kullanım (aşırı ekran, çevre kirliliği) sorun yaratabilir.\n✏️ Bir buluşun önemini sor: \"Bundan önce nasıl yapılıyordu? Bu buluş neyi değiştirdi?\"",

// 6 Küresel Bağlantı
"## Küresel Etkileşim\nDünyadaki ülkelerin siyasi, ekonomik ve kültürel olarak birbirine bağlanmasıdır.\n- Dünya, \"küresel bir köy\" gibi herkesin birbiriyle iletişim halinde olduğu bir yer olmuştur.\n## Ticaret\nÜlkeler ihtiyaçlarını dışarıdan alır, fazlasını dışarıya satar (ithalat-ihracat).\n- Türkiye'den ihraç edilenler: otomotiv, tekstil, tarım ürünleri.\n## Uluslararası İş Birliği\nBirleşmiş Milletler, NATO, Avrupa Birliği gibi kuruluşlar ülkeler arasında iş birliğini sağlar.\n## Küresel Sorunlar\nİklim değişikliği, açlık, savaş ve göç tüm dünyayı ilgilendirir; ortak çözüm gerekir.\n💡 Küresel sorunlar tek bir ülkenin çabasıyla çözülemez; dayanışma şarttır.",

// 7 Üretim, Dağıtım ve Tüketim
"## Üretim\nHam maddelerin emek ve sermaye ile tüketilebilir mala dönüştürülmesidir.\n- Örnek: buğday → un → ekmek\n## Dağıtım\nÜretilen malların tüketiciye ulaştırılmasıdır (depolama, taşıma, mağazalar).\n## Tüketim\nÜretilen malların ihtiyaçları karşılamak üzere kullanılmasıdır.\n## Bilinçli Tüketim ve Tasarruf\n- İhtiyaç ile isteği ayırt etmek.\n- Alışverişte etiket, TSE damgası, son kullanma tarihine bakmak.\n- Tasarruf: kaynakları ve parayı gerektiği kadar kullanmak.\n✏️ \"Okul çantası\" ihtiyaç, \"pahalı oyuncak\" istektir; bilinçli tüketici önce ihtiyacını alır."
],

/* ===================== İNGİLİZCE ===================== */
ing6: [
// 0 Life – Hayat
"## Simple Present (Geniş Zaman)\nAlışkanlıklar ve günlük rutinler için kullanılır.\n- I get up at seven o'clock. (Saat yedide kalkarım.)\n- He/She/It ile fiile -s eklenir: She watches TV in the evening.\n- Olumsuz: I don't like / He doesn't like.\n- Soru: Do you play football? / Does he play football?\n## Günlük Aktiviteler\nget up, brush my teeth, have breakfast, go to school, do homework, go to bed.\n## Saatler\n- 7:00 → It's seven o'clock.\n- 7:15 → It's quarter past seven.\n- 7:30 → It's half past seven.\n- 7:45 → It's quarter to eight.\n💡 Saatlerde \"past\" geçiyor (past seven), \"to\" kala (to eight) anlamına gelir.",

// 1 Yummy Breakfast – Kahvaltı
"## Yiyecek ve İçecekler\nbread, cheese, eggs, milk, juice, tea, honey, butter, olives, jam.\n- \"I have toast and tea for breakfast.\"\n## Some / Any\n- Olumlu: some → I want some cheese.\n- Olumsuz ve soru: any → I don't want any milk. / Do you have any eggs?\n## There is / There are\n- There is + tekil: There is an apple on the table.\n- There are + çoğul: There are two eggs in the fridge.\n## İstek Cümleleri\n- I would like some tea, please.\n- Can I have some juice? / I want some honey.\n✏️ Tekil için \"is\", çoğul için \"are\"; \"some\" olumlu, \"any\" soru/olumsuzdadır.",

// 2 Downtown – Şehirde
"## Şehirdeki Yerler\nbank, hospital, supermarket, park, library, police station, bakery, pharmacy.\n## Yön Sorma ve Tarif\n- Where is the bank? (Banka nerede?)\n- Go straight. (Düz git.)\n- Turn left. (Sola dön.) / Turn right. (Sağa dön.)\n- It's next to the park. (Parkın yanında.)\n- It's between the bank and the bakery. (Banka ile fırın arasında.)\n- It's opposite the school. (Okulun karşısında.)\n## Konum Edatları\nnext to (yanında), between (arasında), opposite (karşısında), in front of (önünde), behind (arkasında).\n💡 \"Turn\" dönmek, \"go straight\" düz gitmek; edatlar yer tarifinin anahtarıdır.",

// 3 Weather and Emotions – Hava ve Duygular
"## Hava Durumu\nsunny (güneşli), rainy (yağmurlu), windy (rüzgârlı), cloudy (bulutlu), snowy (karlı), hot, cold.\n- It's sunny today. (Bugün hava güneşli.)\n- What's the weather like? (Hava nasıl?)\n## Duygular\nhappy, sad, angry, tired, hungry, thirsty, scared, surprised.\n- How do you feel? (Nasıl hissediyorsun?)\n- I feel happy. / I'm tired.\n## Hava ile Duygu Bağlantısı\n- It's rainy, so I feel sad. (Yağmurlu, bu yüzden üzgünüm.)\n- It's sunny, so I'm happy. (Güneşli, bu yüzden mutluyum.)\n✏️ \"feel\" hissetmek; \"What's the weather like?\" ve \"How do you feel?\" kalıplarını ayırt et.",

// 4 Occupations – Meslekler
"## Meslekler\ndoctor (doktor), pilot, teacher (öğretmen), nurse (hemşire), police officer (polis), farmer (çiftçi), chef (aşçı), dentist (diş hekimi).\n## Meslek Sorma\n- What does she do? (O ne iş yapar?)\n- She is a doctor. (O bir doktor.)\n- What do you want to be? (Ne olmak istiyorsun?)\n- I want to be an engineer.\n## Çalışma Yerleri\n- A teacher works at a school.\n- A pilot works at an airport.\n- A chef works in a restaurant.\n## Meslek Tanımları\n- A doctor helps sick people.\n- A police officer catches thieves.\n💡 Meslek sorarken \"What does he/she do?\", kendin için \"What do you do?\" / \"I'm a student.\"",

// 5 Bookworms – Kitapkurtları
"## Kitap Türleri\nnovel (roman), comic (çizgi roman), fairy tale (masal), detective story (macera/polisiye), magazine (dergi).\n## Prefer (Tercih Etmek)\n- I prefer novels to comics. (Romanları çizgi romanlara tercih ederim.)\n- I prefer reading to watching TV.\n- Which do you prefer: books or comics? (Hangisini tercih edersin?)\n## Beğeni Sorma\n- What kind of books do you like? (Ne tür kitaplar seversin?)\n- Do you like adventure stories? Yes, I do. / No, I don't.\n## Kitap Önerisi\n- You should read this book. It's interesting.\n- I recommend this novel. (Bu romanı öneririm.)\n✏️ \"prefer A to B\" = A'yı B'ye tercih etmek; \"recommend\" önermek.",

// 6 Holidays – Tatiller
"## Simple Past (Geçmiş Zaman)\nGeçmişte bitmiş olaylar için kullanılır.\n- I visited my grandparents last summer. (Geçen yaz büyükannemi ziyaret ettim.)\n## Düzenli Fiiller (-ed)\nplay → played, visit → visited, watch → watched, stay → stayed.\n## Düzensiz Fiiller\ngo → went, see → saw, eat → ate, have → had, buy → bought, swim → swam.\n## Olumsuz ve Soru\n- Olumsuz: I didn't go to the beach. (didn't + fiilin yalın hâli)\n- Soru: Did you swim in the sea? → Yes, I did. / No, I didn't.\n## Tatil Kelimeleri\nbeach, sea, hotel, holiday, sunbathe, take photos, visit museums.\n💡 \"did\" zaten geçmiş anlamını verdiği için ana fiil yalın kalır: \"I didn't went\" değil \"I didn't go\".",

// 7 At the Fair – Panayırda
"## Present Continuous (Şimdiki Zaman)\nŞu anda olan eylemler için kullanılır: am/is/are + fiil-ing.\n- I am riding a bike. (Bisiklete biniyorum.)\n- She is eating cotton candy. (O pamuk şeker yiyor.)\n- They are playing games. (Onlar oyun oynuyorlar.)\n## -ing Kuralı\n- Ekle: play → playing, read → reading\n- E ile biten: make → making, ride → riding\n- Kısa ünlülü tek hece: sit → sitting, run → running\n## Panayır Kelimeleri\nferris wheel (dönme dolap), roller coaster, balloon, cotton candy, popcorn.\n## Şu An Yapılanlar\n- What are you doing? (Ne yapıyorsun?)\n- I'm having fun. (Eğleniyorum.)\n✏️ Şimdiki zaman \"şu an\" vurgusu yapar; \"now\", \"at the moment\" gibi kelimelerle kullanılır.",

// 8 Saving the Planet – Gezegeni Koruyalım
"## Çevre Sorunları\npollution (kirlilik), air pollution (hava kirliliği), plastic waste (plastik atık), deforestation (ormanların yok edilmesi), global warming (küresel ısınma).\n## Çözümler ve \"Should\"\nShould, öneri bildirir: \"...yapmalıyız\".\n- We should recycle paper. (Kâğıtları geri dönüştürmeliyiz.)\n- We shouldn't waste water. (Suyu israf etmemeliyiz.)\n- We should plant more trees.\n## Geri Dönüşüm\nrecycle (geri dönüştürmek), reuse (yeniden kullanmak), reduce (azaltmak).\n- 3R: Reduce, Reuse, Recycle.\n## Doğa Kelimeleri\nenvironment (çevre), nature, forest, ocean, energy, plastic bag.\n💡 should + fiil (yalın) öneridir; shouldn't = öneri + olumsuz.",

// 0 Peygamberlere ve İlahi Kitaplara İnanç
"## Peygamberlere İnanç\nPeygamberler, Allah'ın emir ve yasaklarını insanlara bildiren elçilerdir.\n- İnsanlara doğru yolu gösterir, örnek olurlar.\n- Son peygamber Hz. Muhammed'dir (s.a.v.).\n## İlahi Kitaplar\nAllah'ın vahiy yoluyla peygamberlerine gönderdiği kitaplardır.\n## Dört Büyük Kitap\n- Tevrat → Hz. Musa'ya\n- Zebur → Hz. Davut'a\n- İncil → Hz. İsa'ya\n- Kur'an-ı Kerim → Hz. Muhammed'e (s.a.v.)\n## Kutsal Kitap Özellikleri\n- Kur'an, son ilahi kitaptır ve kıyamete kadar korunmuştur.\n- İnsanlar için yol gösterici, doğruyu yanlıştan ayıran rehberdir.\n💡 Dört kitap ve peygamberlerini ezberle: Musa-Tevrat, Davut-Zebur, İsa-İncil, Muhammed-Kur'an.",

// 1 Namaz İbadeti
"## Namazın Önemi\nNamaz, İslam'ın beş şartından biridir; günde beş vakit kılınır.\n- Müslümanı kötülüklerden uzaklaştırır, düzen ve disiplin kazandırır.\n## Beş Vakit Namaz\nSabah, öğle, ikindi, akşam ve yatsı.\n## Namaza Hazırlık: Abdest\nEller, ağız, burun, yüz, kollar, baş ve ayakların yıkanmasıyla alınır; namazdan önce şarttır.\n- Abdestsiz namaz olmaz; temizlik imanın yarısı olarak görülür.\n## Namazın Farzları\n- Dışındaki şartlar (abdest, kıble, vakit, örtünme, niyet).\n- İçindeki şartlar (iftitah tekbiri, kıyam, kıraat, rükû, secde, oturma).\n## Namaz Çeşitleri\nFarz, vacip, sünnet ve nafile namazlar.\n✏️ Namaz kılınışı: niyet → tekbir → kıyam (ayakta Kur'an okuma) → rükû → secde → oturuş → selam.",

// 2 Zararlı Alışkanlıklar
"## Bağımlılık Nedir?\nBir madde ya da davranışın kişiyi kontrol altına alması ve bırakılamaması durumudur.\n## Bağımlılık Yapan Maddeler\nSigara, alkol, uyuşturucu ve teknoloji/oyun bağımlılığı.\n- Sigara: akciğer ve kalp hastalıklarına yol açar.\n- Alkol ve uyuşturucu: vücudu ve aklı bozar, aile ve topluma zarar verir.\n## Başlama Nedenleri\nArkadaş baskısı, merak, özenme ve sorunlardan kaçış.\n## Korunma Yolları\n- Hayır diyebilmek (kararlı olmak).\n- Zararlı ortamlardan uzak durmak.\n- Spor ve sanatla ilgilenmek, iyi arkadaşlar edinmek.\n💡 İlk deneme tehlikelidir; \"bir kereden bir şey olmaz\" yanlış inancı bağımlılığın kapısını açar.",

// 3 Hz. Muhammed'in Hayatı
"## Doğumu ve Çocukluğu\nHz. Muhammed (s.a.v.), 571 yılında Mekke'de doğdu.\n- Babası Abdullah, annesi Âmine'dir; annesi vefat edince büyükbabası ve amcası Ebu Talib baktı.\n- Küçük yaşta çobanlık yaptı, ticaretle uğraştı.\n## \"el-Emin\" (Güvenilir)\nDoğruluğu ve dürüstlüğüyle tanındı; toplum ona \"el-Emin\" (güvenilir) lakabını verdi.\n## Peygamberliği\n40 yaşında Hira Mağarası'nda ilk vahiy geldi (\"Oku\" emriyle Kur'an inmeye başladı).\n## İslam'a Daveti\nÖnce yakınlarını, sonra toplumu İslam'a çağırdı; baskılara rağmen davete devam etti.\n- Medine'ye hicret etti ve orada devletini kurdu.\n💡 Hz. Muhammed'in güvenilirliği (el-Emin), doğruluğu ve merhameti her Müslüman için örnektir.",

// 4 Temel Değerlerimiz
"## Doğruluk ve Dürüstlük\nDoğruyu söylemek, yalan ve hile yapmamaktır.\n- \"Doğru söyleyenin bir ayağı üzengide olmalı\" atasözü gibi, dürüstlük toplumda güven oluşturur.\n## Güvenilirlik\nSözünde durmak, emanete sahip çıkmak.\n## Yardımlaşma\nİhtiyaç sahibine el uzatmak; paylaşmak toplumsal dayanışmayı güçlendirir.\n## Hoşgörü ve Saygı\nFarklı görüş ve davranışlara karşı anlayışlı olmak, insanlara değer vermektir.\n- \"Kendin için istediğini başkası için de iste\" temel ahlak kuralıdır.\n✏️ Bu değerler yalnızca sözde değil; okulda, evde ve sokakta davranışa dönüşmelidir.",

// 5 Kur'an'da Akıl ve Bilgi
"## Akletmek ve Düşünmek\nKur'an, insanları düşünmeye, gözlem yapmaya ve akıllarını kullanmaya çağırır.\n- \"Hiç düşünmez misiniz?\" benzeri ayetler, aklın kullanılmasını ister.\n## Bilginin Önemi\n- \"Oku\" emri, Kur'an'ın ilk emridir.\n- Bilgili insanlar, bilmeyenlerle eşit değildir; ilim övülür.\n## Araştırma ve Öğrenme\nKur'an; evreni, gökyüzünü ve insanı incelemeyi teşvik eder.\n- Bilimsel gözlem, Kur'an'ın teşvik ettiği bir ibadet olarak görülür.\n## Öğütler\nDürüst olmak, adaletli davranmak, ilim öğrenmek ve öğretmek.\n✏️ Kur'an \"düşün\" der; bu yüzden bilim ve din, birbirine karşıt değil, destektir."

bty6: [
// 0 Problem Çözme ve Algoritma
"## Problem Çözme\nProblemi tanıma, çözüm yolları üretme, en uygununu seçme ve uygulama sürecidir.\n1) Problemi anla, 2) Plan yap, 3) Çözümü uygula, 4) Sonucu değerlendir.\n## Algoritma\nBir problemi çözmek için izlenen adım adım sıralı adımlar bütünüdür.\n- \"Sabah kalkınca yapılanlar\" da bir algoritmadır: kalk → yüzünü yıka → kahvaltı → okula git.\n## Akış Şeması\nAlgoritmayı görselleştiren şekildir:\n- Başlangıç/bitiş: oval (elips)\n- İşlem: dikdörtgen\n- Karar (soru): baklava (elmas)\n- Oklar: akış yönü\n## Algoritma Yazarken Dikkat\nAdımlar kısa ve net olmalı; sıra doğru kurulmalı; sonuç kontrol edilmeli.\n💡 Aynı sonucu veren birden çok algoritma olabilir; en az adımlı ve anlaşılır olanı iyidir.",

// 1 Blok Tabanlı Programlama
"## Blok Tabanlı Araçlar\nScratch, Blockly, Code.org gibi araçlarla sürükle-bırak yöntemiyle programlanır.\n- Kod yazmak yerine bloklar birleştirilir; bu, programlama mantığını öğretir.\n## Döngüler\nAynı işlemi tekrar tekrar yaptırmak için kullanılır.\n- \"10 kere tekrarla\" bloğu: aynı hareketi 10 kez çalıştırır.\n- Sonsuz döngü: sürekli tekrar eder (karakterin sürekli yürümesi).\n## Koşullar (Karar Yapıları)\nBir şarta göre farklı işlemler yapılır.\n- \"Eğer ... ise ... değilse ...\" blokları.\n- Örnek: \"Eğer zeminin rengi kırmızıysa dur.\"\n## Olaylar\nBir olay (bayrağa tıklama, tuşa basma) programı başlatır veya tetikler.\n## Oyun ve Animasyon Yapımı\nKarakter, sahne, skor ve ses eklenerek oyun/anlık animasyonlar hazırlanır.\n✏️ Döngü = tekrar, koşul = karar. Oyunlarda skoru artırmak için döngü ve koşullar birlikte kullanılır.",

// 2 Kelime İşlemci İle Belgeler
"## Kelime İşlemci Programları\nWord, Google Docs, LibreOffice Writer gibi yazı belgeleri hazırlamaya yarar.\n## Biçimlendirme\n- Yazı tipi, boyut ve renk değiştirme.\n- Kalın (bold), italik, altı çizili.\n- Hizalama: sola, sağa, ortala, iki yana yasla.\n## Sayfa Düzeni\nKenar boşlukları, kağıt boyutu, yön (dikey/yatay).\n## Listeler ve Tablolar\n- Madde işaretli ve numaralı listeler.\n- Tablolarla bilgiyi satır-sütun düzeninde gösterme.\n## Yazdırma\nÖnizleme yapmak, kopya sayısını ayarlamak ve yazıcıya göndermek.\n💡 Başlıklar için stil kullan (Başlık 1, Başlık 2); metni seçip tek tuşla biçimlendirirsin.",

// 3 Elektronik Tablolama
"## Elektronik Tablo Programları\nExcel, Google Sheets, LibreOffice Calc gibi programlardır.\n## Hücre Kavramı\n- Satır (1, 2, 3...) ve sütunların (A, B, C...) kesiştiği yerlere hücre denir.\n- Hücre adresi: sütun+satır (örn. B5).\n## Veri Girişi\nHücrelere sayı, metin veya tarih girilir.\n## Formüller\nFormül \"=\" ile başlar:\n- =A1+B1 (toplama)\n- =SUM(A1:A5) (aralık toplamı)\n- =A2*B2 (çarpma)\n## Grafikler\nVeri seçilir ve sütun, çizgi veya pasta grafiğe dönüştürülür.\n- Grafik, veriyi görsel ve hızlı yorumlamayı sağlar.\n💡 Formül hücrede görünmez; sonuç gösterilir. Otomatik hesaplama elektronik tablonun gücüdür.",

// 4 Sunum Becerileri
"## Sunum Programları\nPowerPoint, Google Slides, Canva gibi araçlarla slaytlar hazırlanır.\n## Etkili Slayt İlkeleri\n- Az yazı, çok görsel kullan.\n- Başlık kısa ve net olsun.\n- Font büyüklüğü yeterli (en az 24 punto civarı) ve okunaklı olsun.\n- Gereksiz animasyonlarla dikkati dağıtma.\n## Slayt Düzeni\nBaşlık, metin, görsel ve grafik alanlarının dengeli yerleşimi.\n## Animasyon ve Geçişler\n- Slayt geçişleri: slayttan slayta geçerken.\n- Animasyonlar: öğelerin (yazı, resim) giriş/çıkış hareketleri.\n## Sunum Teknikleri\nİzleyiciyle göz teması, yüksek ve net ses, konuya hâkimiyet, zamanı yönetme.\n✏️ Slayt süs değil, anlatımı destekleyen araçtır; en etkili sunum izleyiciyi bilgilendiren ve ilgi çeken sunumdur.",

// 5 Dijital Vatandaşlık ve Güvenlik
"## Dijital Vatandaşlık\nDijital dünyada hak ve sorumluluklarını bilerek, saygılı ve güvenli davranmaktır.\n## Parola Güvenliği\n- Güçlü parola: uzun, büyük-küçük harf + rakam + sembol içerir.\n- Parolayı kimseyle paylaşma; farklı hesaplara farklı parola kullan.\n## Dijital Haklar ve Sorumluluklar\nBaşkasına ait içeriği izinsiz kullanma; kişisel bilgileri koru.\n## Telif Hakları\nYazı, müzik, görsel gibi eserlerin sahibinin izni olmadan kopyalanıp kullanılamamasıdır.\n- Kaynak göstermek (alıntı) kuralı.\n## Güvenli Paylaşım\nAdres, okul, telefon gibi özel bilgileri internette paylaşma.\n- Tanımadığın kişilerin mesajlarına dikkat et; şüpheli bağlantılara tıklama.\n💡 İnternette yazdığın her şey kalıcıdır; paylaşmadan önce iki kez düşün.",

// 6 İletişim ve İş birliği Araçları
"## E-Posta\nElektronik posta; mesaj, dosya ve resim göndermek için kullanılır.\n- Adres yapısı: kullanıcıadı@alanadı (örn. ali@ornek.com).\n- Konu (subject) yazmak, dosya eklemek ve alıcıyı doğru yazmak önemlidir.\n## Dosya Paylaşımı\nBulut depolama (Google Drive, OneDrive) ile dosyalar link üzerinden paylaşılır.\n- Linkin erişim ayarını (yalnızca davetliler) kontrol et.\n## İş birliği Araçları\nGoogle Docs, Canva gibi araçlarla aynı belgeyi birlikte düzenlemek.\n- Yorum ve öneri yaparak birlikte çalışma.\n## Görgü Kuralları (Netiket)\n- Büyük harfle yazma (bağırmak gibidir), kısa ve saygılı ol.\n- Karşındakinin mesajına uygun sürede cevap ver.\n- İzin almadan kişisel bilgi ve fotoğraf paylaşma.\n✏️ E-postada gönder (send) tuşuna basmadan önce alıcı, konu ve ekleri kontrol et.",

// 7 Arama Motorları ve Bilgiye Erişim
"## Arama Motorları\nGoogle, Bing, Yandex gibi araçlar internette bilgiyi bulmaya yarar.\n## Etkili Anahtar Kelime\n- Kısa ve anlamlı anahtar kelimeler kullan: \"Türkiye'nin başkenti\" gibi.\n- Uzun sorular yerine birkaç anahtar kelime daha iyi sonuç verir.\n## Bilginin Doğruluğunu Sorgulama\nİnternetteki her bilgi doğru olmayabilir.\n- Kaynağı kontrol et: resmî kurumlar (.gov, .edu, .k12) ve tanınmış kuruluşlar güvenilirdir.\n- Aynı bilgiyi birden çok kaynaktan doğrula.\n## Güvenli Arama\n- Güvenli arama modunu aç.\n- Reklam sonuçları ile gerçek sonuçları ayırt et.\n- Şüpheli sitelerden ve dosya indirmelerinden kaçın.\n💡 Bilgiyi bulmak kadar, onu doğrulamak da bir beceridir; tek kaynağa güvenme."

// 0 Begrüßung – Selamlaşma
"## Selamlaşma\n- Hallo! (Merhaba!)\n- Guten Morgen! (Günaydın!)\n- Guten Tag! (İyi günler!)\n- Guten Abend! (İyi akşamlar!)\n## Kendini Tanıtma\n- Ich heiße Eymen. (Benim adım Eymen.)\n- Wie heißt du? (Senin adın ne?)\n- Ich komme aus der Türkei. (Türkiye'den geliyorum.)\n## Nasılsın?\n- Wie geht es dir? (Nasılsın?)\n- Mir geht es gut. (Ben iyiyim.)\n- Mir geht es schlecht. (Ben kötüyüm.)\n## Soru Kelimeleri\n- Wie? (Nasıl?), Wo? (Nerede?), Wer? (Kim?), Was? (Ne?)\n✏️ Almanca isimler büyük harfle başlar: \"guten Morgen\" değil \"Guten Morgen\".",

// 1 Zahlen – Sayılar
"## Sayılar 1-20\neins (1), zwei (2), drei (3), vier (4), fünf (5), sechs (6), sieben (7), acht (8), neun (9), zehn (10)\nelft (11), zwölf (12), dreizehn (13), vierzehn (14), fünfzehn (15), sechzehn (16), siebzehn (17), achtzehn (18), neunzehn (19), zwanzig (20).\n## Onlular (20-100)\nzwanzig (20), dreißig (30), vierzig (40), fünfzig (50), sechzig (60), siebzig (70), achtzig (80), neunzig (90), hundert (100).\n- 21 → einundzwanzig (1 ve 20: \"einundzwanzig\")\n- 35 → fünfunddreißig (5 ve 30: \"fünfunddreißig\")\n## Yaş Sorma\n- Wie alt bist du? (Kaç yaşındasın?)\n- Ich bin zwölf Jahre alt. (12 yaşındayım.)\n## Alışverişte Sayılar\nFiyatlar: \"Das kostet fünf Euro.\" (Bu 5 euro eder.)\n💡 Almanca'da birler önce söylenir: 23 → dreiundzwanzig (3 ve 20).",

"## Renkler\nrot (kırmızı), blau (mavi), grün (yeşil), gelb (sarı), schwarz (siyah), weiß (beyaz), grau (gri), braun (kahverengi), orange (turuncu), pink (pembe).\n## Renk Sorma\n- Welche Farbe ist das? (Bu hangi renk?)\n- Das ist rot. (Bu kırmızı.)\n## Was ist das?\n- Was ist das? (Bu nedir?)\n- Das ist ein rotes Auto. (Bu kırmızı bir araba.)\n## Nesneleri Betimleme\nRenk, isimden önce gelir ve isimle uyum sağlar.\n- der rote Ball (kırmızı top), die blaue Tasche (mavi çanta), das grüne Buch (yeşil kitap).\n✏️ Almanca renkler çoğu zaman İngilizce'ye benzer: rot≈red, blau≈blue, grün≈green — hızlı öğrenilir.",

// 3 Meine Familie – Ailem
"## Aile Üyeleri\ndie Mutter (anne), der Vater (baba), die Eltern (anne-baba), die Schwester (kız kardeş), der Bruder (erkek kardeş), die Geschwister (kardeşler), die Großmutter (büyükanne), der Großvater (büyükbaba).\n## Aileyi Tanıtma\n- Das ist meine Mutter. (Bu benim annem.)\n- Das ist mein Vater. (Bu benim babam.)\n- Ich habe eine Schwester. (Bir kız kardeşim var.)\n- Ich habe zwei Brüder. (İki erkek kardeşim var.)\n## Artikel (Tanımlık)\nAlmanca isimlerin tanımlıkları vardır: der (eril), die (dişil), das (nötr).\n- der Vater, die Mutter, das Kind (çocuk).\n💡 Aile tanıtırken \"mein/meine\" (benim) kullanılır: mein Vater, meine Mutter.",

// 4 Die Schulsachen – Okul Eşyaları
"## Okul Eşyaları\n- der Stift (kalem), der Kugelschreiber (tükenmez kalem), der Bleistift (kurşun kalem)\n- das Buch (kitap), das Heft (defter), das Lineal (cetvel)\n- die Schultasche (okul çantası), der Ranzen (okul çantası), die Schere (makas)\n## Artikel Sorusu\n- Was ist das? → Das ist ein Buch.\n- \"der\" için ein, \"die\" için eine, \"das\" için ein.\n## Sahip Olma\n- Ich habe einen Ranzen. (Bir çantam var.)\n## Sınıfta\n- der Tisch (masa), der Stuhl (sandalye), die Tafel (tahta), das Klassenzimmer (sınıf).\n✏️ Artikeli öğrenmeden ismi öğrenme: \"Buch\" değil \"das Buch\" diye ezberle.",

// 5 Hobbys und Freizeit – Hobiler
"## Boş Zaman Aktiviteleri\n- Sport treiben (spor yapmak), Fußball spielen (futbol oynamak), Musik hören (müzik dinlemek), lesen (okumak), schwimmen (yüzmek), zeichnen (resim çizmek).\n## Ich spiele...\n- Ich spiele Fußball. (Futbol oynarım.)\n- Ich spiele Klavier. (Piyano çalarım.)\n- Ich höre Musik. (Müzik dinlerim.)\n## Hobi Sorma\n- Was machst du in deiner Freizeit? (Boş zamanında ne yaparsın?)\n- Was sind deine Hobbys? (Hobilerin neler?)\n- Mein Hobby ist Lesen. (Hobim okumak.)\n✏️ \"spielen\" oynamak/çalmak: Ich spiele Fußball, Ich spiele Klavier; \"hören\" dinlemek.",

"## Yiyecek ve İçecekler\ndas Brot (ekmek), der Käse (peynir), die Butter (tereyağı), das Ei (yumurta), das Wasser (su), die Milch (süt), der Saft (meyve suyu), der Tee (çay), der Kaffee (kahve).\n## Kahvaltı\n- das Frühstück (kahvaltı)\n- Ich esse Brot mit Käse. (Ekmekle peynir yerim.)\n- Ich trinke Milch. (Süt içerim.)\n## İstek Bildirme: Ich möchte...\n- Ich möchte ein Glas Wasser. (Bir bardak su istiyorum.)\n- Ich möchte bitte einen Tee. (Lütfen bir çay istiyorum.)\n- Ich hätte gern ein Brot. (Bir ekmek istiyorum.)\n## Sipariş Verme\n- Was möchtest du? (Ne istersin?)\n- Ich möchte ein Stück Kuchen. (Bir dilim kek istiyorum.)\n✏️ \"möchte\" = istemek (nazik istek); \"essen\" yemek, \"trinken\" içmek.",

// 3 Saf Madde ve Karışımlar
"## Element ve Bileşik\n- Element: tek tür atomdan oluşan saf madde (altın, oksijen, hidrojen).\n- Bileşik: farklı tür atomların kimyasal bağla birleşmesiyle oluşan saf madde (su, tuz, CO₂).\n## Karışımlar\nSaf maddelerin fiziksel olarak bir araya gelmesidir.\n- Homojen (tuzlu su): her yerde aynı görünür.\n- Heterojen (salata, kum-su): farklı görünür.\n## Ayırma Teknikleri\n- Mıknatıs: demir gibi metalleri ayırır.\n- Süzme: katı-sıvı karışımlarını ayırır (çay süzgeci).\n- Buharlaştırma: çözeltiden katıyı ayırır (tuzlu sudan tuz).\n- Yoğunluk farkı: suda yüzen cisimleri ayırır.\n✏️ Element ve bileşik saf madde, karışım saf değildir; ayrıştırma fizikseldir, maddenin kimliği değişmez.",

// 4 Işığın Madde ile Etkileşimi
"## Yansıma\nIşık, parlak yüzeylere çarpınca geri döner.\n- Gelme açısı = yansıma açısı.\n- Düz ayna: görüntü, cisimle eşit uzaklıkta ve boyutudur.\n## Soğrulma\nIşık, bazı maddeler tarafından emilir ve ısıya dönüşür.\n- Siyah yüzeyler ışığı çok soğurur, beyaz yüzeyler az soğurur (siyah çarpan yazın ısınır).\n## Aynalar\n- Düz ayna: gerçek boyut ve simetrik görüntü.\n- Çukur ayna: yaklaşınca büyük görüntü (diş hekimi, el feneri).\n- Tümsek ayna: küçük ve geniş görüş alanı (araç yan aynası).\n## Mercekler\n- İnce kenarlı (yakınsak): ışığı bir noktada toplar (büyüteç).\n- Kalın kenarlı (ıraksak): ışığı dağıtır (gözlük).\n✏️ Ayna yansıtır, mercek ışığı kırar; çukur ayna büyütür, tümsek ayna geniş gösterir.",

"## Akım ve Gerilim\n- Elektrik akımı: yüklerin hareketi; birimi amper (A).\n- Gerilim (potansiyel fark): birimi volt (V).\n## Seri ve Paralel Bağlama\n- Seri bağlama: ampuller aynı hatta; biri yanarsa diğeri de söner; parlaklık azalır.\n- Paralel bağlama: ampuller ayrı hatlarda; biri sönse diğeri yanar; parlaklık korunur.\n## Ampul Parlaklığı\n- Pil sayısı artarsa gerilim artar, ampul daha parlak yanar.\n- Seri bağlı ampuller daha sönük, paralel bağlılar daha parlaktır.\n## Elektrik Devresi Kurma\nPil + ampul + anahtar + kablo ile devre kurulur; kapalı devrede akım geçer.\n✏️ Evlerde paralel bağlama vardır — bu yüzden bir lamba bozulunca diğerleri yanmaya devam eder."

"## Asal Çarpanlar\nBir sayıyı asal sayıların çarpımı olarak yazmaya asal çarpanlara ayırma denir.\n- 24 = 2³ × 3\n- Asal sayılar: 2, 3, 5, 7, 11, 13, 17, 19...\n## EBOB (En Büyük Ortak Bölen)\nİki sayıyı birlikte bölen en büyük sayıdır.\n- 24 ve 36'nın EBOB'u = 12.\n- Asal çarpanlara ayır, ortak olanların en küçük üslülerini çarp.\n## EKOK (En Küçük Ortak Kat)\nİki sayının ortak katlarının en küçüğüdür.\n- 4 ve 6'nın EKOK'u = 12.\n- Asal çarpanlara ayır, ortak ve ortak olmayanların en büyük üslülerini çarp.\n## Ardışık Sayılar\nArdışık doğal sayılar: n, n+1, n+2 ... (Örnek: 5, 6, 7)\n- Ardışık iki sayının EBOB'u 1'dir.\n✏️ EBOB \"bölen\" (paylaştırma, gruplama), EKOK \"kat\" (buluşma, tekrar) problemlerinde kullanılır.",

"## Mevsimler Nasıl Oluşur?\nDünya'nın eksen eğikliği (23,5°) ve Güneş etrafındaki dolanması mevsimleri oluşturur.\n- Dünya Güneş'e yakınken değil, eksen eğikliği yüzünden kuzey yarımküre Güneş'e dönükken yaz yaşanır.\n## Eksen Eğikliği\nDünya'nın dönme ekseni, yörünge düzlemine dik değil eğiktir.\n- Bu eğiklik, güneş ışınlarının geliş açısını ve gece-gündüz süresini değiştirir.\n## İklim ve Hava Durumu\n- Hava durumu: kısa süreli atmosfer olayları (bugün yağmurlu).\n- İklim: uzun yılların ortalama hava durumu (Akdeniz iklimi).\n## Türkiye'de İklim\nKarasal (iç kesimler), Akdeniz (güney), Karadeniz (kuzey) iklimleri görülür.\n✏️ Mevsimi belirleyen Dünya'nın Güneş'e uzaklığı değil, eksen eğikliğidir!\n## Örnek Soru\nSoru: \"Hava durumu ile iklim arasındaki fark nedir?\"\nCevap: Hava durumu kısa süreli (bugün yağmurlu), iklim uzun yılların ortalamasıdır (Akdeniz iklimi).",

// 1 DNA ve Genetik Kod
"## DNA Nedir?\nCanlıların kalıtsal özelliklerini taşıyan, hücre çekirdeğinde bulunan moleküldür.\n- Çift sarmal yapıdadır; yapı birimi nükleotittir.\n- Gen: DNA'nın görev birimi. Genler kromozomlarda bulunur.\n## Kalıtım\nÖzelliklerin genlerle kuşaktan kuşağa aktarılmasıdır.\n- Genotip: genetik yapı (Aa, aa). Fenotip: dış görünüş (sarı tohum).\n- Baskın (dominant) gen özelliği gösterir, çekinik (resesif) gen gizlenir.\n## Mutasyon ve Modifikasyon\n- Mutasyon: gen yapısında meydana gelen kalıcı değişiklik (DNA hasarı).\n- Modifikasyon: çevre etkisiyle geçici değişiklik (bronzlaşma).\n## Adaptasyon\nCanlıların yaşama ve üreme şansını artıran kalıtsal özelliklerdir (çöl bitkisinin dikeni).\n✏️ DNA → gen → kromozom → hücre sıralamasını bil; mutasyon kalıcı, modifikasyon geçicidir.\n## Örnek Soru\nSoru: \"Çöldeki dikenli bitkilerin dikenli olması hangi kavramla açıklanır?\"\nCevap: Adaptasyon. Canlının yaşama şansını artıran kalıtsal özelliktir.",

// 2 Basınç
"## Katı Basıncı\nAğırlığın yüzey alanına bölünmesidir: P = F ÷ A.\n- Aynı ağırlıkta yüzey küçülürse basınç artar (keskin bıçak, kar ayakkabısı).\n## Sıvı Basıncı\nSıvılar, bulundukları kabın her yönüne basınç uygular.\n- Derinlik arttıkça sıvı basıncı artar (baraj dibi güçlü yapılır).\n- Sıvının yoğunluğu arttıkça basınç artar.\n## Atmosfer Basıncı\nHavanın (gazların) ağırlığından dolayı uyguladığı basınçtır.\n- Yükseğe çıkıldıkça azalır (dağda nefes zorlaşır).\n- Torricelli deneyi: açık hava basıncı cıva sütunuyla ölçülür.\n✏️ Katı basıncı yüzey alanına, sıvı basıncı derinliğe ve yoğunluğa, gaz basıncı yüksekliğe bağlıdır.\n## Örnek Soru\nSoru: \"Aynı ağırlıktaki bir kişi neden karda yürürken batarken kar ayakkabısıyla batmaz?\"\nCevap: Yüzey alanı artınca uygulanan basınç azalır (P = F ÷ A).",

// 3 Madde ve Endüstri
"## Periyodik Cetvel\nElementlerin artan atom numarasına göre dizildiği tablodur.\n- Periyotlar: yatay sıralar; gruplar: dikey sütunlar.\n- İlk 20 element iyi bilinmelidir (H, He, Li, Be, B, C, N, O, F, Ne...).\n## Asitler ve Bazlar\n- Asitler: ekşi tattadır, pH < 7, mavi turnusolü kırmızıya çevirir (limon, sirke).\n- Bazlar: kaygan hissettirir, pH > 7, kırmızı turnusolü maviye çevirir (sabun, kireç).\n- Nötralleşme: asit + baz → tuz + su.\n## Kimyasal Tepkimeler\nMaddelerin yeni maddelere dönüştüğü olaylardır.\n- Giren maddelerin kütlesi = ürünlerin kütlesi (kütle korunur).\n- Örnek: 2H₂ + O₂ → 2H₂O\n✏️ Asit-bazı \"pH değeri, tat, turnusol\" ile ayırt et; kimyasal tepkimede madde yok olmaz, dönüşür.\n## Örnek Soru\nSoru: \"Limon suyunun mavi turnusol kâğıdına etkisi nedir?\"\nCevap: Mavi turnusolu kırmızıya çevirir çünkü limon asidiktir (pH < 7).",

// 4 Basit Makineler
"## Basit Makineler\nİş yapmayı kolaylaştıran aletlerdir (kuvvetten ya da yoldan kazanç sağlar).\n- Hiçbir basit makine işten kazanç sağlamaz.\n## Kaldıraçlar\nBir destek noktası etrafında dönen çubuklardır.\n- Kuvvet kolu uzadıkça kuvvetten kazanç artar (tahterevalli, pense, makas).\n## Makaralar\n- Sabit makara: kuvvetin yönünü değiştirir, kuvvetten kazanç yok.\n- Hareketli makara: kuvvetten 2 kat kazanç sağlar.\n## Eğik Düzlem\nYokuş; aynı yüksekliğe daha az kuvvetle çıkmayı sağlar (rampa, vida, çivi).\n## Dişliler, Vida ve Kaldırma\n- Dişliler: kuvvet ve hareket iletir.\n- Vida: eğik düzlemin sarılmış halidir.\n✏️ Basit makineler \"kuvvetten veya yoldan\" kazandırır, asla işten kazandırmaz.\n## Örnek Soru\nSoru: \"Bir yükü 2 metre yüksekliğe çıkarmak için hangi basit makine daha az kuvvetle iş görür?\"\nCevap: Eğik düzlem (rampa). Aynı yüksekliğe daha uzun ama daha az kuvvetle çıkarır.",

// 5 Enerji Dönüşümleri ve Çevre Bilimi
"## Fotosentez\nBitkilerin ışık enerjisini kullanarak besin (glikoz) ve oksijen üretmesidir.\n- 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ (ışık ve klorofil gerekli).\n## Solunum\nBesinlerin oksijenle yakılarak enerji üretilmesidir.\n- Besin + O₂ → CO₂ + H₂O + enerji (fotosentezin tersi).\n## Besin Zinciri ve Enerji Akışı\nÜretici (bitki) → tüketici (otçul → etçil) → ayrıştırıcı.\n- Her basamakta enerji kaybı olur; üreticiler en fazla enerjiye sahiptir.\n## Sürdürülebilirlik ve Çevre\n- Enerji tasarrufu, geri dönüşüm ve yenilenebilir enerji (güneş, rüzgâr).\n- Fosil yakıtların azaltılması küresel ısınmayı yavaşlatır.\n✏️ Fotosentez besin+O₂ üretir, solunum enerji için besini yakar; ikisi birbirini tamamlar.\n## Örnek Soru\nSoru: \"Besin zincirinde en fazla enerjiye hangi canlı sahiptir?\"\nCevap: Üreticiler (bitkiler). Her basamakta enerjinin bir kısmı kaybedilir.",

// 6 Elektrik Yükleri ve Elektrik Enerjisi
"## Elektrik Yükleri\n- Pozitif (+) ve negatif (−) yükler vardır.\n- Aynı yükler birbirini iter, zıt yükler birbirini çeker.\n- Nötr cisimlerde yük dengesi vardır.\n## Elektriklenme\n- Sürtünmeyle: saçı taramak (tarağın kâğıdı çekmesi).\n- Dokunmayla ve etkiyle (tesirle) elektriklenme çeşitleri.\n## Elektrik Akımı ve Devre\nAkım, yüklerin düzenli hareketidir; birimi amper (A).\n- Seri ve paralel bağlama; ampul parlaklığı gerilime bağlıdır.\n## Enerji Tasarrufu ve Güvenlik\n- A+ cihazlar, LED ampuller enerji tasarrufu sağlar.\n- Islak elle elektrikli aletlere dokunma; topraklı priz kullan.\n✏️ Aynı yükler iter, zıt yükler çeker; elektriklenme günlük hayatta (kağıt çekme) görülür.\n## Örnek Soru\nSoru: \"Sürtünmeyle elektriklenen tarak küçük kağıt parçalarını neden çeker?\"\nCevap: Tarak sürtünmeyle yüklenir ve zıt yüklü kağıt parçalarını çeker.",
],

/* ===================== TÜRKÇE ===================== */
trk8: [
// 0 Sözcükte Anlam
"## Anlam İlişkileri\n- Eş anlamlı: öğretmen/muallim. Zıt anlamlı: genç/yaşlı.\n- Eş sesli (sesteş): yazılışı aynı, anlamı farklı: \"yüz\".\n- Yakın anlamlı: aralarında küçük anlam farkı olanlar: \"kırmak/bükmek\".\n## Gerçek, Mecaz ve Terim Anlam\n- Gerçek: ilk akla gelen anlam. Mecaz: aktarmalı anlam. Terim: alana özel anlam.\n## Deyim ve Atasözleri\n- Deyim: kalıplaşmış mecazlı ifade (\"Kulak vermek\").\n- Atasözü: öğüt veren kalıplaşmış söz (\"Sakla samanı, gelir zamanı\").\n💡 Sesteşleri cümle içinde anlamlandır; \"yüz\" örneğinde olduğu gibi bağlam çok önemlidir.",

// 1 Cümlede Anlam
"## Anlam İlişkileri\n- Neden-sonuç, amaç-sonuç, koşul-sonuç cümleleri.\n- Öznel/nesnel yargılar; karşılaştırma; dolaylı anlatım.\n## Cümle Yorumlama\n- Gizli mesaj: \"Kapıyı kapatmayı unutma\" → dolaylı istek.\n- Örtülü anlam: \"Yine geç kalmış.\" → daha önce de geç kaldığı.\n## Geçiş ve Bağlantı İfadeleri\nama, fakat, ancak, çünkü, oysa, buna rağmen, ayrıca, yani, sonuç olarak.\n💡 Örtülü anlamı bulmak için cümlede söylenmeyen ama ima edilen bilgiyi ara.",

// 2 Fiilimsiler ve Fiil Çatıları
"## Fiilimsiler\nFiilden türeyen, fiil özelliği taşımayan sözcüklerdir.\n- İsim-fiil: -ma, -iş, -mak (\"yüzmeyi severim\").\n- Sıfat-fiil: -an, -ası, -mez, -ar, -dik, -ecek, -miş (\"gelen çocuk\").\n- Zarf-fiil: -ıp, -arak, -ince, -ken, -dikçe, -meden (\"koşarak geldi\").\n## Fiil Çatıları\n- Öznesine göre: etken (\"Ali kapıyı açtı\"), edilgen (-il/-in: \"kapı açıldı\").\n- Nesnesine göre: geçişli (nesne alır: \"kitabı okudu\"), geçişsiz (nesne almaz: \"uyudu\").\n💡 \"-mak\" takısı alıyorsa fiil, alamıyorsa fiilimsidir; çatı sorusu: \"Kim?\" özne, \"Neyi?\" nesne.",

// 3 Cümlenin Öğeleri
"## Temel Öğeler\n- Yüklem: işi/oluşu bildirir (cümlenin kalbi).\n- Özne: işi yapan (\"kim/ne?\" sorusu).\n## Yardımcı Öğeler\n- Nesne: işten etkilenen (\"neyi/kimi?\").\n- Dolaylı tümleç: \"nereye/nerede/nereden/kime/kimde?\"\n- Zarf tümleci: \"nasıl/ne zaman/ne kadar?\"\n## Öge Uyumu\n- Özne-yüklem uyumu (kişi ve sayı).\n- Tekil özne, çoğul yüklem kullanımı dikkat gerektirir.\n💡 Önce yüklemi bul, sonra sırasıyla özne → nesne → tümleç araması yap.",

// 4 Sözcük Türleri: Tamlamalar
"## İsim Tamlaması\nİki ismin bir araya gelerek oluşturduğu tamlamadır.\n- Belirtili: okulun bahçesi (-in ... -i)\n- Belirtisiz: okul bahçesi (-i eki)\n- Zincirleme: okul bahçesinin kapısı.\n## Sıfat Tamlaması\nBir sıfatla bir ismin oluşturduğu tamlamadır.\n- mavi göz, üç elma, bu kitap.\n- İsim tamlaması \"iyelik\", sıfat tamlaması \"niteleme/belirtme\" ilişkisi kurar.\n💡 Ayırt et: \"okulun kapısı\" isim tamlaması, \"tahta kapı\" sıfat tamlamasıdır.",

// 5 Metin Türleri ve Anlatım
"## Metin Türleri\n- Hikâye, roman, masal (olay anlatır).\n- Makale, deneme, fıkra, gezi yazısı, anı, biyografi (bilgi ve düşünce).\n- Şiir (duygu ve ritim).\n## Anlatım Biçimleri\n- Açıklama: bilgi verir. Tartışma: düşünceyi savunur.\n- Betimleme: görsel olarak anlatır. Öyküleme: olayı akış içinde anlatır.\n## Düşünceyi Geliştirme Yolları\nTanımlama, örneklendirme, tanık gösterme, benzetme, karşılaştırma, sayısal veriler.\n💡 Metin türünü sorunun neyi amaçladığına göre ayır: bilgi mi, olay mı, duygu mu?", 

// 6 Paragraf
"## Ana Düşünce ve Yardımcı Düşünceler\n- Ana düşünce: paragrafın asıl mesajı.\n- Yardımcı düşünceler: ana düşünceyi destekleyenler.\n## Anlam Akışı\nParagrafta cümleler mantıklı bir sırayla dizilir.\n- \"Bu paragrafın akışını bozan cümle hangisidir?\" sorularında konu dışına çıkan cümle aranır.\n## Konu ve Başlık\nKonu geneldir (\"kitap okuma\"); başlık en kısa özettir.\n## Paragrafın Yapısı\nGiriş (ana düşünceyi tanıtır) → gelişme (örnekler) → sonuç (toparlar).\n💡 Ana düşünce için \"Yazar ne anlatmak istiyor?\" sorusu her zaman işe yarar.",

// 7 Yazım ve Noktalama
"## Yazım Kuralları\n- Büyük harfler, \"de/da\" ve \"ki\"nin yazımı.\n- Sayıların yazımı, kısaltmalar ve birleşik sözcüklerin yazımı.\n- \"dahi\" sözcüğünün \"de\" ile karıştırılmaması.\n## Noktalama İşaretleri\nNokta, virgül, noktalı virgül, iki nokta, üç nokta, soru, ünlem, tırnak, parantez, kesme, kısa çizgi, eğik çizgi.\n- Virgülün kullanım yerleri: sıralama, ara söz, hitap, tırnak içi sözden önce.\n✏️ \"De\" ayrıysa bağlaç, bitişikse hâl ekidir; yazım testlerinde en çok bu çıkar."
],

/* ===================== T.C. İNKILAP TARİHİ ===================== */
ink8: [
// 0 Bir Kahraman Doğuyor
"## Mustafa Kemal'in Hayatı\n1881'de Selanik'te doğdu. Babası Ali Rıza Efendi, annesi Zübeyde Hanım'dır.\n- Manastır Askerî İdadisi'nde okudu; tarihe ve vatan sevgisine ilgi duydu.\n- Harp Okulu'ndan kurmay subay olarak mezun oldu.\n## Osmanlı'nın Son Dönemi\nOsmanlı, I. Dünya Savaşı öncesinde toprak kaybediyor ve ekonomik olarak zorlanıyordu.\n- Milliyetçilik akımı ve iç isyanlar devleti zayıflattı.\n## Askerlik Yılları\nÇanakkale Savaşı'nda büyük başarı gösterdi (19. Tümen Komutanı).\n- İstanbul'un ve Anadolu'nun işgali karşısında kurtuluş mücadelesine atıldı.\n✏️ Mustafa Kemal'in çocukluğu ve eğitimi, onun mücadeleci kişiliğinin temelini oluşturur.\n## Örnek Soru\nSoru: \"Mustafa Kemal hangi savaşta büyük başarı göstererek tanınmıştır?\"\nCevap: Çanakkale Savaşı'nda (19. Tümen Komutanı olarak).",

// 1 Millî Uyanış: Bağımsızlık Yolunda Adımlar
"## I. Dünya Savaşı ve Mondros\nOsmanlı, İttifak Devletleri'nin yanında savaşa girdi; yenilgi üzerine 30 Ekim 1918'de Mondros Ateşkes Antlaşması imzalandı.\n- Antlaşma sonrası Anadolu işgal edilmeye başlandı.\n## İşgaller ve Kuva-yı Milliye\n- İzmir Yunanlılar, İstanbul ve bazı bölgeler İtilaf Devletleri tarafından işgal edildi.\n- Halk, Kuva-yı Milliye (milli kuvvetler) ile direniş başlattı.\n## Mustafa Kemal'in Samsun'a Çıkışı\n19 Mayıs 1919'da Mustafa Kemal, Samsun'a çıkarak millî mücadeleyi başlattı.\n## Kongreler\n- Havza ve Amasya Genelgesi: \"milletin bağımsızlığını yine milletin azim ve kararı kurtaracaktır\".\n- Erzurum ve Sivas Kongreleri: vatanın bölünmez bütünlüğü kararlaştırıldı.\n- Temsil Heyeti kuruldu; kongrelerle milli irade esas alındı.\n✏️ 19 Mayıs (Atatürk'ü Anma, Gençlik ve Spor Bayramı), millî mücadelenin başlangıcı kabul edilir.\n## Örnek Soru\nSoru: \"Millî mücadele hangi tarihte ve nerede fiilen başlamıştır?\"\nCevap: 19 Mayıs 1919'da Mustafa Kemal'in Samsun'a çıkmasıyla.",

// 2 Millî Bir Destan: Ya İstiklal ya Ölüm
"## TBMM'nin Açılışı\n23 Nisan 1920'de Ankara'da Türkiye Büyük Millet Meclisi açıldı.\n- \"Hâkimiyet kayıtsız şartsız milletindir.\"\n## Kurtuluş Savaşı Cepheleri\n- Batı Cephesi: I. ve II. İnönü, Sakarya Meydan Muharebesi (savunma).\n- Büyük Taarruz ve 30 Ağustos Başkomutanlık Meydan Muharebesi (zafer).\n- Doğu: Ermenilerle yapılan savaş (Gümrü Antlaşması); Güney: Fransızlarla mücadele.\n## Lozan Barış Antlaşması\n24 Temmuz 1923'te imzalandı.\n- Türkiye'nin bağımsızlığı bütün dünyaca tanındı.\n- Kapitülasyonlar (yabancılara verilen ayrıcalıklar) kaldırıldı.\n- Misak-ı Milli sınırları esas alındı.\n✏️ Zaferin ve Lozan'ın anlamı: Türk milletinin bağımsızlığının tescili. 30 Ağustos Zafer Bayramı'dır.\n## Örnek Soru\nSoru: \"Lozan Antlaşması'nda Türkiye lehine kaldırılan en önemli ayrıcalıklar hangileridir?\"\nCevap: Kapitülasyonlar (yabancılara verilen ayrıcalıklar) kaldırıldı.",

// 3 Atatürkçülük ve Cumhuriyetin İlkeleri
"## Cumhuriyetin İlanı\n29 Ekim 1923'te Cumhuriyet ilan edildi; Mustafa Kemal ilk cumhurbaşkanı oldu.\n## Atatürk İlkeleri\n- Cumhuriyetçilik: yönetimde millet iradesi.\n- Milliyetçilik: milletini sevme ve birlik.\n- Halkçılık: eşitlik ve halkın çıkarları.\n- Devletçilik: devletin ekonomide rol alması.\n- Laiklik: din ve devlet işlerinin ayrılması.\n- İnkılapçılık: çağdaşlaşma için yenilik.\n## İnkılaplar\n- Saltanat kaldırıldı (1922), halifelik kaldırıldı (1924).\n- Yeni Türk harfleri kabul edildi (1928), Türk Tarih ve Dil Kurumları kuruldu.\n- Şapka ve kıyafet kanunu, takvim-saat ve ölçülerde değişiklik.\n✏️ İlkeler birbirini tamamlar; örn. laiklik ve halkçılık çağdaşlığın temelidir.\n## Örnek Soru\nSoru: \"Din ve devlet işlerinin ayrılmasını savunan Atatürk ilkesi hangisidir?\"\nCevap: Laiklik. Devletçilik ise ekonominin devlet eliyle planlanmasıdır.",

// 4 Demokratikleşme Çabaları ve Atatürk Dönemi
"## Demokratikleşme\n- 1924 Anayasası ile çok partili hayata geçiş denemeleri yapıldı.\n- Kadınlara seçme ve seçilme hakkı tanındı (1934) — demokrasinin önemli adımı.\n## Eğitim ve Sağlık\n- Tevhid-i Tedrisat Kanunu: eğitim birleştirildi ve millileştirildi.\n- Okuma yazma seferberliği (Millet Mektepleri), köy enstitüleri.\n- Sağlık Bakanlığı kuruldu, sağlık ocakları ve hastaneler yaygınlaştı.\n## Sosyal Devlet Adımları\n- Fabrika ve bankalar kuruldu (Sümerbank, Etibank).\n- Demiryolları millileştirildi; vergiler adil hale getirildi.\n💡 Bu dönemde eğitim, sağlık ve ekonomi alanlarında köklü yenilikler yapıldı.\n## Örnek Soru\nSoru: \"Kadınlara seçme ve seçilme hakkı hangi yıl tanınmıştır?\"\nCevap: 1934'te tanındı. Bu, demokratikleşmenin önemli bir adımıydı.",

// 5 Atatürk Dönemi Türk Dış Politikası
"## Dış Politika İlkeleri\n- \"Yurtta barış, cihanda barış\" anlayışı.\n- Bağımsızlık ve tam egemenlik esas alındı; akılcı ve gerçekçi politika izlendi.\n## Önemli Gelişmeler\n- Milletler Cemiyeti'ne katılım.\n- Balkan Antantı ve Sadabat Paktı ile komşularla iş birliği.\n## Montrö Boğazlar Sözleşmesi (1936)\nBoğazların yönetimi Türkiye'ye geçti; güvenlik sağlandı.\n## Hatay'ın Anavatana Katılması\nHatay, 1939'da oy çokluğuyla Türkiye'ye katıldı.\n✏️ Atatürk'ün dış politikası: barışçı, bağımsız ve milli menfaatlere dayalıydı.\n## Örnek Soru\nSoru: \"Boğazların yönetiminin Türkiye'ye geçmesini sağlayan antlaşma hangisidir?\"\nCevap: Montrö Boğazlar Sözleşmesi (1936)."
],

ing8: [

"## Arkadaşlık İfadeleri\n- I get on well with my classmates. (Sınıf arkadaşlarımla iyi geçinirim.)\n- We have common interests. (Ortak ilgi alanlarımız var.)\n## Öneri Sunma\n- What about going to the cinema? (Sinemaya gitmeye ne dersin?)\n- Why don't we play chess? (Satranç oynasak?)\n- Let's meet at the park. (Parkta buluşalım.)\n## Kabul ve Reddetme\n- Sounds great! / That's a good idea! (kabul)\n- I'm afraid I can't. / I'm sorry, I have other plans. (red)\n✏️ Öneri kalıpları: \"What about + -ing?\", \"Why don't we + fiil?\", \"Let's + fiil\".",

<script>

/* Depolama koruması: localStorage engellenen ortamlarda (bazı tablet/viewer

(function () {
  var mem = {}, t = null;
  try { t = window.localStorage; var _k = '__depo_test__'; t.setItem(_k, '1'); t.removeItem(_k); } catch (e) { t = null; }
  if (!t) {
    t = {
      getItem: function (k) { return (k in mem) ? mem[k] : null; },
      setItem: function (k, v) { mem[k] = String(v); },
      removeItem: function (k) { delete mem[k]; }
    };
  }
  try { Object.defineProperty(window, 'localStorage', { value: t, configurable: true, writable: true }); }
  catch (e) { window.localStorage = t; }
})();
function $(id) { return document.getElementById(id); }
function kaydet(a, b) { localStorage.setItem('dersApp_' + a, JSON.stringify(b)); }
function oku(a) { try { return JSON.parse(localStorage.getItem('dersApp_' + a)); } catch (e) { return null; } }

var ekran = document.getElementById('ekran');

function DERS_IKON(id) {
  var ikon = { trk: '📖', mat: '🧮', fen: '🔬', sos: '🌍', ink: '🇹🇷', din: '🕌', ing: '🇬🇧', alm: '🇩🇪', bty: '💻' };
  return ikon[id.substr(0, 3)] || '📘';
}

/* ====== DURUM ====== */
var durum = { tur: 'menu', sinif: null, ders: null, kitap: null, sayfa: 0, quiz: null, qSira: 0, qDogru: 0, qListe: [] };

/* ====== VERİ YARDIMCILARI ====== */
function dersBul(s, dersId) {
  var bilgi = MUFREDAT[s];
  if (!bilgi) return null;
  for (var i = 0; i < bilgi.dersler.length; i++) if (bilgi.dersler[i].id === dersId) return bilgi.dersler[i];
  return null;
}

function biten(k) {
  var done = oku('biti') || {};
  return !!done[k];
}

/* ====== TEST VERİSİ ====== */
function birimTest(dersId, bi) {
  var q = SORULAR[dersId];
  if (!q) return [];
  return (q[bi] || []).slice();
}
function tumSorular(dersId) {
  var q = SORULAR[dersId];
  if (!q) return [];
  var sonuc = [];
  for (var k in q) sonuc = sonuc.concat(q[k] || []);
  return sonuc;
}
function testVar(dersId) { return tumSorular(dersId).length > 0; }

/* ====== NAVİGASYON ====== */
function git(tur) {
  if (durum.tur === 'test' && tur !== 'test') sureDurdur();
  if (durum.tur === 'test' && tur === 'menu') devamSil();
  if ((durum.tur === 'kim' || durum.tur === 'hiz') && tur !== 'kim' && tur !== 'hiz') oyunDurdur();
   if (durum.tur === 'kart' && durum.kart && tur !== 'kart' && tur !== 'kartSon') {
    if (durum.kart.hepsi) kartKaydet(durum.kart.d, durum.kart.hepsi);
  }
  if (durum.tur === 'deney' && durum.deney && tur !== 'deney') durum.deney = null;
  if (durum.tur === 'seviye' && durum.sev && tur !== 'seviye' && tur !== 'seviyeSon') durum.sev = null;
  if (durum.tur === 'kodla' && durum.kodla && tur !== 'kodla') durum.kodla = null;
   durum.tur = tur;
   if (tur === 'menu') { durum.sinif = null; durum.ders = null; durum.cozDers = null; }
   tabGuncelle();
   render();
 }

/* ===== VIDEO DERS / ÇÖZÜMLÜ VİDEO ===== */
function videoUrl(dersId, i) {
  var v = (typeof VIDEO !== 'undefined') && VIDEO && VIDEO[dersId];
  if (!v) return null;
  var u = v[i];
  return (typeof u === 'string' && u.length) ? u : null;
}
function videoEmbedHTML(url) {
  if (!url) return '';
  if (/youtu\.be\/|youtube\.com\/(embed|v)\//.test(url)) {
    var id = (url.match(/(?:youtu\.be\/|embed\/|v=)([A-Za-z0-9_-]{6,})/));
    id = id ? id[1] : '';
    return '<iframe src="https://www.youtube.com/embed/' + id + '?rel=0&modestbranding=1" frameborder="0" allowfullscreen></iframe>';
  }
  if (/\.(mp4|webm|ogg)(\?|$)/i.test(url)) {
    return '<video controls autoplay muted><source src="' + url + '"></video>';
  }
  return '<iframe src="' + url + '" allowfullscreen></iframe>';
}
function acKapaVideo(dersId, i, baslik) {
  var url = videoUrl(dersId, i);
  if (!url) return;
  var bas = baslik || (MUFREDAT[seciliSinif()] && MUFREDAT[seciliSinif()].dersler) ? dersBul(seciliSinif(), dersId) : null;
  var ad = bas && bas.birimler[i] ? bas.birimler[i].ad : (dersId + '-' + (i + 1));
 $('modal').innerHTML = '<div class="modal-icerik"><span class="kap" onclick="kapatOverlay()">✕</span><h3>🎬 ' + ad + '</h3><div class="video-wrap">' + videoEmbedHTML(url) + '</div></div>';
  $('overlay').classList.add('acik');
  $('modal').classList.add('acik');
}
function kapatOverlay() {
  $('modal').innerHTML = '';
  $('overlay').classList.remove('acik');
  $('modal').classList.remove('acik');
}

/* ====== KONU DERS NOTLARI (Konu İçerikleri) ====== */
function detayHTML(t) {
  if (!t) return '';
  return t.split('\n').map(function (sat) {
    sat = sat.trim();
    if (!sat) return '';
    if (sat.indexOf('## ') === 0) return '<h3 class="detay-baslik">' + sat.slice(3) + '</h3>';
    if (sat.indexOf('- ') === 0) return '<div class="detay-madde">• ' + sat.slice(2) + '</div>';
    return '<p class="detay-paragraf">' + sat + '</p>';
  }).join('');
}
function konuCalis(dersId, i) {
  var d = dersBul(seciliSinif(), dersId);
  if (!d || !d.birimler[i]) return;
  var b = d.birimler[i];
  var detay = b.detay;
  if (!detay) { alert('Bu konu için ders notu henüz hazır değil.'); return; }
  var h = '<div class="modal-icerik konu-icerik"><span class="kap" onclick="kapatOverlay()">✕</span>';
  h += '<h3 style="margin-bottom:4px">📖 ' + b.ad + '</h3>';
  h += '<div class="konu-kazanim">🎯 ' + esc(b.kazanim || '') + '</div>';
  h += '<div class="detay-alan">' + detayHTML(detay) + '</div>';
  h += '<button class="kucuk-buton" style="background:#1f8a70;margin-top:12px" onclick="konuSesliOku(\'' + dersId + '\',' + i + ')">🔊 Bu Konuyu Sesli Dinle</button>';
  h += '</div>';
  $('modal').innerHTML = h;
  $('overlay').classList.add('acik');
  $('modal').classList.add('acik');
}
function konuSesliOku(dersId, i) {
  if (!window.speechSynthesis) { alert('Tarayıcı sesli okumayı desteklemiyor.'); return; }
  var d = dersBul(seciliSinif(), dersId);
  var b = d && d.birimler[i];
  var metin = b ? (b.ad + '. ' + (b.detay || b.ozet || '')) : '';
  if (!metin) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(metin.replace(/## /g, '').replace(/- /g, ''));
  u.lang = 'tr-TR';
  var sesler = window.speechSynthesis.getVoices();
  for (var v = 0; v < sesler.length; v++) { if ((sesler[v].lang || '').indexOf('tr') === 0) { u.voice = sesler[v]; break; } }
  window.speechSynthesis.speak(u);
}

/* ====== OKUL KÜTÜPHANESİ (e-Kitap) ====== */
function kitapProgress(id) { var s = oku('kitap') || {}; return (s[id] != null) ? s[id] : 0; }
function kitapKaydet(id, sayfa) { var s = oku('kitap') || {}; s[id] = sayfa; kaydet('kitap', s); }
function kitapTamam(id) {
  var k = KITAP[id]; if (!k || !k.sayfa || !k.sayfa.length) return false;
  return kitapProgress(id) >= k.sayfa.length - 1;
}
function favVar(id) { return !!(oku('kitapFavori') || {})[id]; }
function favToggle(id) {
  var f = oku('kitapFavori') || {};
  f[id] = !f[id];
  kaydet('kitapFavori', f);
  if (durum.tur === 'kitaplik') cizKitaplik();
}
function kitapAc(id) {
  durum.kitap = id;
  durum.sayfa = kitapProgress(id);

}
function okumaSes(ac) {
  if (!window.speechSynthesis) { alert('Tarayıcı sesli okumayı desteklemiyor.'); return; }
  if (!ac) { window.speechSynthesis.cancel(); return; }

  h += '<span class="kucuk-not">' + (durum.sayfa + 1) + '/' + k.sayfa.length + '</span>';
  h += '<button class="btn" onclick="okumaSonra()"' + (durum.sayfa >= k.sayfa.length - 1 ? ' disabled' : '') + '>Sonraki ➡️</button></div>';

  if (kitapTamam(id)) {

  }
  ekran.innerHTML = h;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}

/* ====== ÖNERİ: ZAYIF KONULAR ====== */
function oneriKonular(limit) {
  limit = limit || 5;
  var s = seciliSinif();
  if (!s) {
    var p = profilOku();
    if (p.sinif) s = String(p.sinif).charAt(0);
  }
  if (!s) return [];
  var bilgi = MUFREDAT[s];
  if (!bilgi) return [];
  var puan = oku('puan') || {};
  var aday = [];
  bilgi.dersler.forEach(function(d) {
    d.birimler.forEach(function(b, bi) {
      var list = (puan[d.id] || []).filter(function(e){ return String(e.u) === String(bi); });
      var skor = null;
      if (list.length) {
        var dt = 0, nt = 0;
        list.forEach(function(e){ dt += e.d; nt += e.n; });
        skor = nt ? Math.round(dt / nt * 100) : 0;
      }
      aday.push({ dersId: d.id, dersAd: d.ad, bi: bi, birimAd: b.ad, skor: skor, deneme: list.length });
    });
  });
  function oncelik(a) {
    if (a.skor === null) return 0;
    if (a.skor < 70) return 1;
    if (a.skor < 100) return 2;
    return 3;
  }
  aday.sort(function(a, b) {
    var d = oncelik(a) - oncelik(b);
    if (d !== 0) return d;
    if (a.skor === null && b.skor === null) return a.deneme - b.deneme;
    if (a.skor === null) return 1;
    if (b.skor === null) return -1;
    return a.skor - b.skor;
  });
  return aday.slice(0, limit);
}

function cizOneri() {
  var l = oneriKonular(4);
  if (!l.length) return '';
  var s = seciliSinif();
  var h = '<div class="ozet-karti" style="margin-top:18px">';
  h += '<div class="baslik"><h2 style="font-size:18px">🤖 Şu konulara çalış!</h2><p style="font-size:13px;color:#5c6b85">Zayıf veya az çalışılan birimler.</p></div>';
  h += '<div class="unitler">';
  l.forEach(function(o) {
    var etiket = o.skor === null ? '⚡ Hiç çalışılmadı' : (o.skor < 70 ? '😅 Zayıf (' + o.skor + '%)' : (o.skor < 100 ? '🙂 ' + o.skor + '%' : '✅ ' + o.skor + '%'));
    h += '<div class="unit"><div class="unit-baslik" onclick="secDers(\'' + s + '\',\'' + o.dersId + '\')" style="justify-content:space-between">' +
         '<span style="flex:1"><span class="uad">' + o.dersAd + ' ▸ ' + (o.bi + 1) + '. ' + o.birimAd + '</span>' +
         '<div class="durum-ikon">' + etiket + '</div></span></div></div>';
  });
  h += '</div></div>';
  return h;
}

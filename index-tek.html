<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Okul Ders Uygulamam</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f3f6fb;
  --text: #243145;
  --card: #ffffff;
  --accent: #9b59b6;
  --border: #e0e0e0;
  --header-bg: linear-gradient(135deg, #6a5cff, #b04bff);
  --header-text: #ffffff;
}
[data-theme="dark"] {
  --bg: #1a1a1a;
  --text: #ffffff;
  --card: #2c2c2c;
  --accent: #b388ff;
  --border: #404040;
  --header-bg: linear-gradient(135deg, #4a3da0, #6a4bff);
  --header-text: #ffffff;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  color: var(--text);
  transition: background 0.3s ease, color 0.3s ease;
}

header {
  background: var(--header-bg);
  color: var(--header-text);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  flex-wrap: wrap;
  gap: 8px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 2px 10px rgba(0,0,0,.15);
  transition: background 0.3s ease;
}

.logo {
  background: none; border: none; color: #fff; font-size: 20px; font-weight: 800; cursor: pointer;
}

.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs button {
  background: rgba(255,255,255,.18); border: none; color: #fff;
  padding: 8px 14px; border-radius: 20px; font-size: 15px; font-weight: 600; cursor: pointer;
}
.tabs button:hover { background: rgba(255,255,255,.35); }
.tabs button.aktif { background: #fff; color: #8a2be2; }

main { max-width: 900px; margin: 20px auto; padding: 0 14px; }

.baslik { text-align: center; margin-bottom: 18px; }
.baslik h1 { font-size: 30px; margin-bottom: 6px; }
.baslik p { color: #5c6b85; font-size: 16px; }

.ozet-karti {
  text-align: center; background: #fff; border-radius: 20px; padding: 26px;
  box-shadow: 0 6px 20px rgba(0,0,0,.06);
}

.gradeler { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-top: 14px; }

.grade-card {
  border: none; border-radius: 22px; padding: 26px 10px; font-size: 20px; font-weight: 800;
  color: #fff; cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,.15);
  transition: transform .12s;
}
.grade-card:hover { transform: translateY(-4px) scale(1.02); }
.grade-card .yildiz { font-size: 34px; display: block; margin-bottom: 6px; }

.renk5  { background: linear-gradient(145deg,#2ecc71,#27ae60); }
.renk6  { background: linear-gradient(145deg,#3498db,#2980b9); }
.renk7  { background: linear-gradient(145deg,#f39c12,#e67e22); }
.renk8  { background: linear-gradient(145deg,#9b59b6,#8e44ad); }

.dersler { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 14px; }

.ders-card {
  background: var(--card); border-radius: 18px; padding: 16px; text-align: left; border: 1px solid var(--border);
  box-shadow: 0 4px 14px rgba(0,0,0,.07); cursor: pointer; transition: transform .12s;
  display: flex; align-items: center; gap: 12px;
}
.ders-card:hover { transform: translateY(-3px); }
.ders-card .ikon { font-size: 34px; }
.ders-card .ad { font-weight: 800; font-size: 17px; }
.ders-card .alt { font-size: 13px; color: #6c7a92; }

.btn { border: none; border-radius: 14px; padding: 12px 18px; font-size: 16px; font-weight: 700; cursor: pointer; color: #fff; }
.btn-geri { background: #94a3b8; }
.btn-test { background: linear-gradient(145deg,#e74c3c,#c0392b); }
.btn-ogren { background: linear-gradient(145deg,#2ecc71,#27ae60); }
.btn-bitir { background: linear-gradient(145deg,#3498db,#2980b9); }
.btn-neo { background: linear-gradient(145deg,#f39c12,#e67e22); }
.btn-mor { background: linear-gradient(145deg,#9b59b6,#8e44ad); }
.btn-meb { background: linear-gradient(145deg,#2c3e50,#34495e); text-decoration: none; display: inline-block; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

.ust-satir { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.ust-satir h2 { margin-right: auto; font-size: 24px; }

.unitler { display: flex; flex-direction: column; gap: 12px; }

.unit {
  background: var(--card); border-radius: 16px; box-shadow: 0 3px 12px rgba(0,0,0,.06);
  overflow: hidden;
  border: 1px solid var(--border);
}
.unit-baslik {
  display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer;
}
.unit-baslik .num {
  background: var(--r); color: #fff; width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0;
}
.unit-baslik .uad { font-weight: 700; font-size: 17px; flex: 1; }
.unit-baslik .ok { transition: transform .2s; }
.unit.acik .ok { transform: rotate(90deg); }
.unit-acik { padding: 0 16px 14px; }

.unit .durum-ikon {
  font-size: 22px; flex-shrink: 0;
}

.ozet-kutusu { background: #f0f4ff; border-radius: 12px; padding: 12px; margin-bottom: 10px; font-size: 15px; line-height: 1.55; }
.meb-kazanim { background: #fff7e6; border-left: 4px solid #f39c12; border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; font-size: 13px; color: #8a6d1a; line-height: 1.5; }
body.gece .meb-kazanim { background: #3a3322; color: #f0d183; border-left-color: #f39c12; }
.konular { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.konu-etiket {
  background: #e6ebf7; color: #43506e; border-radius: 20px; padding: 5px 12px; font-size: 13px;
}

.unit-butonlar { display: flex; gap: 8px; flex-wrap: wrap; }
.kucuk-buton {
  border: none; border-radius: 12px; padding: 8px 14px; font-weight: 700; font-size: 14px;
  color: #fff; cursor: pointer;
}

/* Test */
.quiz-kutu { background: #fff; border-radius: 20px; padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,.07); max-width: 640px; margin: 0 auto; }
.quiz-baslik { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
.iller-puan { font-size: 14px; color: #6c7a92; }
.quiz-soru { font-size: 19px; font-weight: 700; margin: 6px 0 18px; line-height: 1.5; }
.secenek {
  display: block; width: 100%; text-align: left; border: 2px solid #dfe5f0; background: #fbfcfe;
  border-radius: 14px; padding: 12px 16px; font-size: 16px; margin-bottom: 10px; cursor: pointer;
}
.secenek:hover { border-color: #9b59b6; }
.secenek.dogru { border-color: #2ecc71; background: #d5fae0; }
.secenek.yanlis { border-color: #e74c3c; background: #fde3e3; }
.sonuc { text-align: center; padding: 10px 0; }
.sonuc .buyuk { font-size: 60px; }
.sonuc .puan { font-size: 26px; font-weight: 800; margin: 8px 0; }

/* plan */
.plan-hafta { display: flex; gap: 10px; overflow-x: auto; margin-top: 14px; }
.plan-gun { background: #fff; border-radius: 16px; padding: 12px; min-width: 170px; box-shadow: 0 3px 10px rgba(0,0,0,.06); }
.plan-gun h3 { font-size: 15px; margin-bottom: 8px; color: #6a5cff; }
.plan-gun label { display: flex; gap: 8px; font-size: 14px; padding: 6px 0; cursor: pointer; align-items: flex-start; }
.plan-gun input { transform: scale(1.3); margin-top: 4px; }
.plan-not { margin-top: 14px; background: #fff3cd; border-radius: 14px; padding: 12px 16px; }

/* ilerleme */
.ilerleme-kutusu { background: #fff; border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 3px 10px rgba(0,0,0,.05); }
.ilerleme-ust { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 8px; }
.cubuk { height: 14px; background: #e8ecf5; border-radius: 10px; overflow: hidden; }
.cubuk-dolgu { height: 100%; background: linear-gradient(90deg,#2ecc71,#27ae60); border-radius: 10px; transition: width .4s; }

.skor-liste { background: var(--card); border-radius: 16px; padding: 12px 16px; box-shadow: 0 3px 10px rgba(0,0,0,.05); border: 1px solid var(--border); }
.skor-satir { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #e3e8f2; font-size: 15px; }
.rozet { font-size: 30px; }

.yildiz-dolu { color: #f1c40f; }

.geri { font-size: 13px; color: #96a3b8; cursor: pointer; border: none; background: none; margin-bottom: 8px; }

/* form */
.form-kutu { max-width: 420px; margin: 0 auto; background: #fff; border-radius: 18px; padding: 20px; }
.formal input, .form-sinif select {
  width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #dfe5f0; font-size: 15px; margin: 6px 0 14px;
}
.formalin label { font-weight: 700; }

.kucuk-not { text-align: center; color: #8b97ad; font-size: 13px; margin-top: 12px; }

.overlay { display:none; position: fixed; inset:0; background: rgba(0,0,0,.45); z-index: 90; }
.overlay.acik { display: block; }
.modal {
  display:none; position: fixed; z-index: 100; left: 50%; top: 50%; transform: translate(-50%,-50%);
  background: #fff; border-radius: 20px; padding: 24px; width: min(92vw, 620px);
  max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,.3);
}
.modal.acik { display: block; }
.modal h3 { margin-bottom: 10px; }
.modal .kap { float: right; width: 34px; height: 34px; border-radius: 50%; border: none; background: #eee; font-size: 18px; cursor: pointer; }
.modal .video-wrap { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; }
.modal .video-wrap iframe, .modal .video-wrap video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.modal .video-wrap video { max-height: 50vh; }
.video-ikon { margin-left: 8px; cursor: pointer; font-size: 16px; opacity: .85; }
.video-ikon:hover { opacity: 1; }
body.gece .modal { background: #242733; color: #e8eaf0; }

/* kütüphane */
.kitap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-top: 8px; }
.kitap-kart { background: var(--k5,#fff); border: 1px solid var(--k1,#eee); border-radius: 14px; padding: 14px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
body.gece .kitap-kart { background: #2c303a; border-color: #3a404d; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.kitap-kapak { font-size: 38px; margin-bottom: 6px; }
.kitap-baslik { font-weight: 700; font-size: 14px; margin: 6px 0; }
.kitap-yazar { color: #9aa6c2; font-size: 12px; }

/* okuma modu */
.okuma-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.okuma-bar .geri { margin-right: 6px; }
.okuma-baslik { font-weight: 700; font-size: 17px; flex: 1; }
.okuma-buton { background: transparent; border: none; font-size: 19px; cursor: pointer; padding: 4px 8px; }
.okuma-sayfa { background: var(--k5,#fff); border: 1px solid var(--k1,#eee); border-radius: 14px; min-height: 320px; display: flex; align-items: center; justify-content: center; padding: 22px; line-height: 1.7; font-size: 17px; }
body.gece .okuma-sayfa { background: #242733; border-color: #3a404d; color: #e8eaf0; }
.sayfa { text-align: left; max-width: 760px; }
.okuma-alt { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 16px; }

/* haftalık yarışma */
.yarisma-kutu { background: var(--k5,#fff); border: 1px solid var(--k1,#eee); border-radius: 14px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
body.gece .yarisma-kutu { background: #2c303a; border-color: #3a404d; }
.yarisma-ust { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin-bottom: 8px; }
.odul-alindi { margin-top: 10px; padding: 10px; border-radius: 10px; background: #e8f8f0; color: #1f8a70; text-align: center; font-weight: 700; }
body.gece .odul-alindi { background: #1e3a30; color: #6fddbb; }
.yarisma-liste { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.yarisma-satir { display: flex; align-items: center; gap: 10px; background: var(--k5,#fff); border: 1px solid var(--k1,#eee); border-radius: 10px; padding: 8px 12px; }
body.gece .yarisma-satir { background: #2c303a; border-color: #3a404d; }
.yarisma-ad { font-size: 13px; font-weight: 600; min-width: 110px; }
.yarisma-puan { font-size: 13px; color: #8b97ad; min-width: 70px; text-align: right; }

/* Denematik – aylık deneme */
.deneme-kutu { background: var(--k5,#fff); border: 1px solid var(--k1,#eee); border-radius: 14px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
body.gece .deneme-kutu { background: #2c303a; border-color: #3a404d; }
.deneme-acik { padding: 12px; border-radius: 10px; background: #e8f8f0; color: #1f8a70; font-weight: 600; }
body.gece .deneme-acik { background: #1e3a30; color: #6fddbb; }
.deneme-kapali { padding: 12px; border-radius: 10px; background: #fdeeee; color: #c0392b; font-weight: 600; }
body.gece .deneme-kapali { background: #3a2222; color: #e88; }
.deneme-satir { display: flex; justify-content: space-between; align-items: center; background: var(--k5,#fff); border: 1px solid var(--k1,#eee); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
body.gece .deneme-satir { background: #2c303a; border-color: #3a404d; }
.deneme-puan { font-weight: 800; color: #6a5cff; }
.deneme-eksik { display: flex; align-items: center; gap: 10px; background: var(--k5,#fff); border: 1px solid var(--k1,#eee); border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; }
body.gece .deneme-eksik { background: #2c303a; border-color: #3a404d; }
.deneme-eksik > span:last-child { flex: 1; }

/* 3B Fen animasyonları */
.fen3d-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.fen3d-kart { border: 1px solid var(--k1,#eee); border-radius: 14px; padding: 12px; background: var(--k5,#fff); box-shadow: 0 2px 8px rgba(0,0,0,.05); }
body.gece .fen3d-kart { background: #2c303a; border-color: #3a404d; }
.fen3d-bilgi { margin-top: 8px; }
.fen3d-bilgi b { font-size: 14px; }
.fen3d-bilgi small { color: #8b97ad; }
.fen3d-sahne { height: 90px; display: flex; align-items: center; justify-content: center; font-size: 48px; border-radius: 12px; overflow: hidden; background: radial-gradient(circle at 30% 30%, #232f4b, #141b2e); }
.fen3d-sahne-buyuk { height: 220px; display: flex; align-items: center; justify-content: center; font-size: 96px; border-radius: 14px; overflow: hidden; background: radial-gradient(circle at 30% 30%, #232f4b, #141b2e); }
.fen3d-anlatim { line-height: 1.6; color: var(--text,#243145); }
.sahne-gezegen .fen3d-sahne, .sahne-gezegen.fen3d-sahne-buyuk { font-size: 120px; animation: fen-don 9s linear infinite; }
.sahne-kalp .fen3d-sahne, .sahne-kalp.fen3d-sahne-buyuk { animation: fen-kalp 1s ease-in-out infinite; }
.sahne-kuvvet .fen3d-sahne, .sahne-kuvvet.fen3d-sahne-buyuk { animation: fen-ok 1.4s ease-in-out infinite; }
.sahne-tanecik .fen3d-sahne, .sahne-tanecik.fen3d-sahne-buyuk { animation: fen-zit 2s ease-in-out infinite; }
.sahne-ses .fen3d-sahne, .sahne-ses.fen3d-sahne-buyuk { animation: fen-dalga 1.6s ease-in-out infinite; }
.sahne-solunum .fen3d-sahne, .sahne-solunum.fen3d-sahne-buyuk { animation: fen-nefes 3s ease-in-out infinite; }
.sahne-elektrik .fen3d-sahne, .sahne-elektrik.fen3d-sahne-buyuk { animation: fen-parla 1.2s ease-in-out infinite; }
@keyframes fen-don { from { transform: rotate(0deg) scale(1); } to { transform: rotate(360deg) scale(1); } }
@keyframes fen-kalp { 0%,100% { transform: scale(1); } 25% { transform: scale(1.18); } 40% { transform: scale(1); } 60% { transform: scale(1.12); } }
@keyframes fen-ok { 0%,100% { transform: translateX(-14px); } 50% { transform: translateX(14px); } }
@keyframes fen-zit { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-26px); } }
@keyframes fen-dalga { 0%,100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.25) rotate(8deg); } }
@keyframes fen-nefes { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }
@keyframes fen-parla { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.8); } }

/* Canlı ders takvimi */
.canli-gun { background: var(--k5,#fff); border: 1px solid var(--k1,#eee); border-radius: 12px; padding: 10px; margin-bottom: 10px; }
body.gece .canli-gun { background: #2c303a; border-color: #3a404d; }
.canli-bugun { border: 2px solid #6a5cff; }
.canli-gun-baslik { font-weight: 800; margin-bottom: 8px; font-size: 15px; }
.canli-etiket { font-size: 12px; color: #1f8a70; }
.canli-oturum { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px dashed var(--k1,#ddd); }
.canli-saat { font-weight: 700; font-size: 13px; color: #6a5cff; min-width: 48px; }
.canli-bilgi { flex: 1; }
.canli-bilgi small { color: #8b97ad; }
.canli-modal { text-align: center; }
.canli-canli { display: inline-block; background: #c0392b; color: #fff; font-weight: 800; letter-spacing: 2px; padding: 4px 14px; border-radius: 20px; margin-bottom: 10px; animation: fen-parla 1s infinite; }
.canli-konu { color: #8b97ad; margin: 8px 0; }
.canli-ozet { background: var(--k5,#f4f6fb); border-radius: 10px; padding: 12px; line-height: 1.6; margin: 10px 0; text-align: left; }

/* Yazdırılabilir etkinlikler */
.etkinlik-liste { display: flex; flex-direction: column; gap: 8px; }
.etkinlik-satir { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--k5,#fff); border: 1px solid var(--k1,#eee); border-radius: 10px; padding: 10px 12px; }
body.gece .etkinlik-satir { background: #2c303a; border-color: #3a404d; }
.etkinlik-satir small { color: #8b97ad; }
/* Yazdırılabilir etkinlikler
   ÖLÇÜ SİSTEMİ:
   --yazdir-dis-ofset  : dış çerçeve ofseti (sayfa kenarından çerçeveye uzaklık)
   --yazdir-cam-ofset  : cam ofseti (dış çerçeveden sonra içeriğin başladığı iç pay)
   --yazdir-ara-mesafe : ara mesafe (bölümler arası dikey boşluk ölçüsü) */
:root {
  --yazdir-dis-ofset: 1.5cm;
  --yazdir-cam-ofset: 1cm;
  --yazdir-ara-mesafe: 0.7cm;
}
.yazdir-alan { display: none; }
.yazdir-icerik { max-width: 800px; margin: var(--yazdir-dis-ofset) auto; padding: var(--yazdir-cam-ofset); font-family: Arial, sans-serif; color: #000; border: 1px dashed #999; }
.yazdir-baslik { border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: var(--yazdir-ara-mesafe); }
.yazdir-kimlik { margin-top: 6px; }
.yazdir-ozet { background: #f0f4ff; border: 1px solid #c9d6f0; border-radius: 8px; padding: 10px; line-height: 1.6; margin-bottom: var(--yazdir-ara-mesafe); }
.yazdir-soru { margin-bottom: var(--yazdir-ara-mesafe); line-height: 1.5; }
.yazdir-secenek { padding-left: 18px; margin: 4px 0; }
.yazdir-cevap { margin-top: calc(var(--yazdir-ara-mesafe) + 0.3cm); border-top: 1px dashed #999; padding-top: 8px; background: #f7f7f7; }
.yazdir-cizgi { border-bottom: 1px solid #999; height: 34px; margin-top: 6px; }
.yazdir-alt { text-align: center; margin-top: calc(var(--yazdir-ara-mesafe) + 0.4cm); color: #555; }
@media print {
  @page { margin: 1.5cm; }
  body * { visibility: hidden; }
  #yazdirAlan, #yazdirAlan * { visibility: visible; }
  #yazdirAlan { display: block !important; position: absolute; left: 0; top: 0; width: 100%; }
  .yazdir-icerik { margin: 0 auto; padding: var(--yazdir-cam-ofset); box-shadow: none; }
}

/* eşleştirme */
.esle-kutu { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 4px; }
@media (max-width: 560px) { .esle-kutu { grid-template-columns: 1fr; } }
.esle-sol { order: 1; }
.esle-sag { order: 1; }
.esle-bas { font-weight: 800; color: #fff; background: linear-gradient(135deg, #6a5cff, #9b59b6); border-radius: 12px; padding: 8px 12px; margin-bottom: 8px; text-align: center; }
.esle-btn {
  display: block; width: 100%; border: 2px solid #dfe5f0; background: #fbfcfe;
  border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 8px;
  text-align: left; cursor: pointer;
}
.esle-btn:hover { border-color: #9b59b6; }
.esle-btn.esle-sec { border-color: #f39c12; background: #fff6dd; }
.esle-btn.esle-done { background: #d5fae0; border-color: #2ecc71; color: #2a6b; cursor: default; }
.esle-btn:disabled { opacity: .85; }

/* ====== SUNUM ====== */
.ust-satir { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
.sunum-duzen { display: grid; grid-template-columns: 200px 1fr; gap: 14px; }
@media (max-width: 640px) { .sunum-duzen { grid-template-columns: 1fr; } }
.sunum-list { display: flex; flex-direction: column; gap: 8px; }
.slayt-mini {
  display: block; text-align: left; border: 3px solid transparent; color: #fff;
  border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 700; cursor: pointer;
}
.slayt-mini:hover { transform: translateY(-1px); }
.slayt-mini.slayt-aktif { border-color: #f39c12; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.slayt-mini .sayi {
  display: inline-block; background: rgba(255,255,255,.25); border-radius: 8px; padding: 0 6px; margin-right: 6px; font-size: 11px;
}
.sunum-sag { display: flex; flex-direction: column; gap: 10px; }
.slayt-buyuk {
  border-radius: 16px; padding: 28px 20px; min-height: 260px; position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
}
.slayt-no { position: absolute; top: 12px; left: 14px; font-weight: 800; opacity: .75; }
.slayt-emoji { font-size: 58px; line-height: 1; }
.slayt-baslik { font-size: 30px; font-weight: 900; margin: 10px 0 6px; }
.slayt-metin { font-size: 17px; opacity: .95; white-space: pre-wrap; max-width: 90%; }
.sun-edit {
  background: #fff; border: 1px solid #dfe5f0; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
}
.sun-edit label { font-weight: 700; font-size: 13px; color: #5c5f73; }
.sun-edit input, .sun-edit textarea {
  border: 2px solid #dfe5f0; border-radius: 10px; padding: 8px 10px; font-size: 14px; font-family: inherit; width: 100%;
}
.sun-edit input:focus, .sun-edit textarea:focus { outline: none; border-color: #9b59b6; }
.sun-temalar, .sun-emojiler { display: flex; gap: 6px; flex-wrap: wrap; }
.tema-btn { border: 2px solid transparent; color: #fff; border-radius: 10px; padding: 6px 10px; cursor: pointer; font-weight: 700; font-size: 12px; }
.tema-btn.secili, .emoji-btn.secili { outline: 3px solid #f39c12; border-color: #fff; }
.emoji-btn { border: 2px solid #dfe5f0; background: #fbfcfe; border-radius: 10px; padding: 4px 8px; cursor: pointer; font-size: 18px; }
.emoji-btn:hover { border-color: #9b59b6; }
.sun-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sun-sayac { font-weight: 700; color: #5c5f73; }

.pomo-gun { display: flex; justify-content: space-around; margin: 8px 0 4px; font-weight: 700; font-size: 14px; color: #5c5f73; }
body.gece .pomo-gun { color: #9aa6c2; }
.sun-tam { position: fixed; inset: 0; background: #14141f; color: #fff; display: flex; flex-direction: column; z-index: 100; }
.sun-ust { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; gap: 10px; flex-wrap: wrap; }
.sun-ad { font-weight: 800; }
.sun-ust-btn { background: rgba(255,255,255,.12); border: none; color: #fff; border-radius: 10px; padding: 8px 12px; cursor: pointer; font-weight: 700; }
.sun-ust-btn:hover { background: rgba(255,255,255,.28); }
.sun-slide {
  flex: 1; margin: 0 auto; width: 92%; max-width: 1000px; border-radius: 18px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 30px;
  box-shadow: 0 10px 40px rgba(0,0,0,.4);
}
.sun-slide-no { font-weight: 800; opacity: .7; margin-bottom: 12px; }
.slayt-buyuk-baslik { font-size: 44px; font-weight: 900; margin: 14px 0; }
.slayt-buyuk-metin { font-size: 24px; opacity: .95; white-space: pre-wrap; max-width: 85%; }
.sun-not { text-align: center; padding: 8px; font-size: 12px; color: #9aa0b5; }

/* ====== XP / ARAÇLAR ====== */
.durum-karti { display: grid; grid-template-columns: repeat(auto-fit,minmax(120px,1fr)); gap: 10px; margin: 0 0 10px; }
.durum-huc { background: #fff; border-radius: 14px; padding: 12px; text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,.05); }
.durum-huc b { display: block; font-size: 13px; color: #5c5f73; margin-bottom: 4px; }
.durum-huc span { font-size: 22px; font-weight: 900; color: #6a5cff; }
.seviye-cubuk { margin-bottom: 16px; }
.seviye-cubuk .cubuk { margin-bottom: 6px; }
.araclar { display: grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap: 10px; }
.arac { background: #fff; border: 1px solid #dfe5f0; border-radius: 16px; padding: 16px 10px; text-align: center; cursor: pointer; font-weight: 800; font-size: 14px; color: #243145; }
.arac:hover { border-color: #9b59b6; transform: translateY(-2px); }
.arac-ikon { display: block; font-size: 30px; margin-bottom: 6px; }
.arac small { font-weight: 500; color: #8b97ad; font-size: 12px; }

/* Seviye seçimi */
.seviye-satir { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; font-size: 13px; font-weight: 700; color: #5c5f73; }
.zbut { border: 2px solid #dfe5f0; background: #fbfcfe; border-radius: 20px; padding: 5px 12px; font-size: 13px; font-weight: 700; cursor: pointer; color: #243145; }
.zbut:hover { border-color: #9b59b6; }
.z1 { background: #e8f8e0; border-color: #86d46a; }
.z2 { background: #fff6dd; border-color: #f0c04d; }
.z3 { background: #ffe6e0; border-color: #e77c6c; }
.hak { margin: 8px 0; }
.hak-ust { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #5c5f73; margin-bottom: 4px; }
.hak.zayif .cubuk-dolgu { background: #e74c3c; }
.hak.orta .cubuk-dolgu { background: #f39c12; }
.hak.guclu .cubuk-dolgu { background: #2ecc71; }

/* Rozetler */
.rozetler { display: grid; grid-template-columns: repeat(auto-fill,minmax(140px,1fr)); gap: 10px; }
.rozet { background: #fff; border-radius: 16px; padding: 14px 10px; text-align: center; border: 1px solid #dfe5f0; position: relative; }
.rozet.acik { border-color: #8e44ad; box-shadow: 0 3px 10px rgba(142,68,173,.15); }
.rozet.kapali { opacity: .55; filter: grayscale(.9); }
.rozet-ikon { font-size: 34px; margin-bottom: 4px; }
.rozet-ad { font-weight: 800; font-size: 14px; }
.rozet-ac { font-size: 11px; color: #8b97ad; margin-top: 3px; }
.rozet-kilit { position: absolute; top: 8px; right: 8px; font-size: 15px; }

/* Pomodoro */
.pomo-kutu { background: #fff; border-radius: 20px; padding: 30px 20px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,.06); }
.pomo-saat { font-size: 72px; font-weight: 900; letter-spacing: 2px; margin: 10px 0 18px; font-variant-numeric: tabular-nums; }
.pomo-mod { font-size: 20px; font-weight: 800; }
.pomo-butonlar { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* Geri sayım */
.sayac-ekle { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; }
.sayac-ekle input { border: 2px solid #dfe5f0; border-radius: 12px; padding: 10px 12px; font-size: 14px; font-family: inherit; }
.sayac-ekle input:focus { outline: none; border-color: #9b59b6; }
.sayac-list { display: flex; flex-direction: column; gap: 10px; }
.sayac-kart { background: #fff; border-radius: 14px; padding: 12px 14px; box-shadow: 0 3px 10px rgba(0,0,0,.05); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sayac-ad { font-size: 15px; }
.sayac-ad small { color: #8b97ad; }
.sayac-gun { font-size: 24px; font-weight: 900; text-align: center; }

/* program grid */
.program-grid { display: grid; grid-template-columns: 70px repeat(7, 1fr); gap: 6px; margin-top: 10px; }
.program-satir { display: contents; }
.program-satir > div { background: var(--card); border-radius: 12px; padding: 8px 6px; min-height: 70px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,.04); font-size: 12px; }
.program-header { font-weight: 700; text-align: center; align-items: center; justify-content: center; background: #6a5cff; color: #fff; }
.program-saat { text-align: center; align-items: center; justify-content: center; font-weight: 700; color: #5c5f73; }
.program-gun { text-align: center; align-items: center; justify-content: center; font-weight: 700; color: #5c5f73; }
.program-elm { display: flex; align-items: center; gap: 4px; cursor: pointer; }
.program-bos { justify-content: center; text-align: center; color: #9aa6c2; }
.program-bos:hover { background: #f0f4ff; }
.program-edit { flex-wrap: wrap; align-items: end; gap: 2px; cursor: default; }
.program-edit select, .program-edit input { flex: 1 1 100%; }
.program-sil { float: right; background: transparent; border: none; color: #e74c3c; font-size: 14px; cursor: pointer; margin-left: 4px; }
body.gece .program-header { background: #4a2f77; }
body.gece .program-saat, body.gece .program-gun { color: #b9c4e0; }
.saat-sel { border: 1px solid var(--border); border-radius: 8px; padding: 2px 6px; background: var(--card); color: var(--metin); font-size: 13px; }
.saat-sel:focus { outline: 2px solid #6a5cff; }
.konu-raporu { background: var(--card); border-radius: 14px; box-shadow: 0 3px 10px rgba(0,0,0,.05); overflow: hidden; }
.konu-satir { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
.konu-satir:last-child { border-bottom: none; }
.konu-header { font-weight: 700; color: #6a5cff; }
.konu-ad { flex: 2; display: flex; align-items: center; gap: 8px; }
.konu-say { flex: 1; min-width: 90px; color: #5c6b85; }
.konu-cubuk { flex: 2; display: flex; align-items: center; gap: 6px; }
.konu-cubuk .cubuk { flex: 1; height: 10px; background: #edf0f7; border-radius: 6px; overflow: hidden; }
.konu-cubuk .cubuk-dolgu { height: 100%; border-radius: 6px; transition: width .3s; }
.konu-cubuk .kucuk-buton { min-width: 34px; }
body.gece .konu-header { color: #b8a5f2; }
body.gece .konu-satir { border-bottom-color: #2a3347; }
.sayac-sil { background: #fdecec; border: none; border-radius: 10px; padding: 8px; cursor: pointer; font-size: 16px; }

/* Bilgi kartları */
.kart-alan { text-align: center; }
.kart { background: #fff; border-radius: 20px; padding: 40px 24px; min-height: 220px; display: flex; flex-direction: column; justify-content: center; gap: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.08); margin-bottom: 16px; }
.kart-on { font-size: 26px; font-weight: 900; color: #6a5cff; }
.kart-arka { font-size: 18px; color: #243145; background: #f0f4ff; border-radius: 12px; padding: 12px; line-height: 1.5; }
.kart-butonlar { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* Hakimiyet haritası */
.lejant { background: #fff; border-radius: 12px; padding: 10px 14px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; font-weight: 600; margin-bottom: 14px; color: #5c5f73; }
.l-lej { margin-right: 4px; font-size: 18px; }
.l-lej.bo { color: #d7dde8; }
.l-lej.zayif { color: #e74c3c; }
.l-lej.orta { color: #f39c12; }
.l-lej.guclu { color: #2ecc71; }
.harita-sinif { background: #fff; border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 3px 10px rgba(0,0,0,.05); }
.harita-sinif h2 { margin-bottom: 8px; }
.harita-dersler { display: flex; flex-direction: column; gap: 10px; }
.harita-ders h3 { font-size: 14px; margin-bottom: 6px; color: #5c5f73; }
.harita-hucrel { display: flex; flex-wrap: wrap; gap: 6px; }
.harita-huc { width: 42px; height: 42px; border: none; border-radius: 10px; font-weight: 800; color: #fff; cursor: pointer; font-size: 14px; }
.harita-huc.bo { background: #d7dde8; color: #8b97ad; }
.harita-huc.zayif { background: #e74c3c; }
.harita-huc.orta { background: #f39c12; }
.harita-huc.guclu { background: #2ecc71; }
.harita-huc:hover { transform: scale(1.08); }

/* ====== YANLIŞLARIM ====== */
.yanlis-kart { background: #fff; border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 3px 10px rgba(0,0,0,.05); }
.yanlis-ust { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; margin-bottom: 8px; color: #e74c3c; flex-wrap: wrap; gap: 6px; }
.yanlis-ust small { color: #8b97ad; font-weight: 600; }
.yanlis-soru { font-size: 16px; font-weight: 700; margin-bottom: 8px; line-height: 1.5; }
.yanlis-sec { display: block; border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; font-size: 14px; line-height: 1.4; }
.yanlis-dogru { background: #d5fae0; border: 2px solid #2ecc71; font-weight: 700; }
.yanlis-secim { background: #fde3e3; border: 2px solid #e74c3c; font-weight: 700; }
.yanlis-duz { background: #fbfcfe; border: 1px solid #dfe5f0; }
.yanlis-btnler { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

/* ====== GÜNLÜK GÖREVLER ====== */
.gorev-satir { background: #fff; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(0,0,0,.05); }
.gorev-ust { display: flex; align-items: center; gap: 10px; }
.gorev-ikon { font-size: 26px; }
.gorev-ad { font-weight: 800; flex: 1; font-size: 15px; }
.gorev-xp { background: #f0f4ff; color: #6a5cff; border-radius: 20px; padding: 3px 10px; font-size: 12px; font-weight: 800; }
.gorev-ok { font-size: 22px; color: #2ecc71; }
.gorev-satir.tamam { opacity: .8; }
.gorev-ilerleme { margin-top: 6px; font-size: 12px; color: #8b97ad; font-weight: 700; }

/* ====== REKOR ====== */
.rekor-bilgi { margin: 12px auto 0; max-width: 620px; padding: 10px 14px; border-radius: 12px; background: #f0f4ff; font-weight: 700; text-align: center; font-size: 14px; }
.rekor-yeni { background: #fff3cd; color: #8a6d1a; }

/* ====== SÜRELİ TEST ====== */
.sure-goster { font-weight: 900; font-size: 16px; color: #e74c3c; font-variant-numeric: tabular-nums; }

/* ====== ÇALIŞMA TAKVİMİ ====== */
.takvim { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 3px 10px rgba(0,0,0,.05); }
.takvim-huc { aspect-ratio: 1; border: none; border-radius: 8px; font-size: 12px; font-weight: 800; cursor: default; display: flex; align-items: center; justify-content: center; }
.takvim-huc.sifir { background: #eef1f7; color: #a4afc5; }
.takvim-huc.az { background: #cdeccd; color: #2c6e2c; }
.takvim-huc.orta { background: #8fd48f; color: #145214; }
.takvim-huc.cok { background: #3fa63f; color: #fff; }
.takvim-huc.bugun { outline: 2px solid #6a5cff; }
.takvim-not { display: flex; gap: 12px; justify-content: center; margin-top: 10px; font-size: 12px; font-weight: 700; color: #5c5f73; flex-wrap: wrap; }

/* ====== KART DERS SATIRI ====== */
.kart-ders { flex-wrap: wrap; }
.kart-bilgi { flex: 1; }
.kart-btnler { display: flex; gap: 6px; }

/* ====== PROFİL ====== */
.profil-ust { display: flex; align-items: center; gap: 8px; }
.tema-btn-ust { background: rgba(255,255,255,.18); border: none; color: #fff; border-radius: 20px; padding: 8px 12px; cursor: pointer; font-size: 15px; font-weight: 700; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tema-btn-ust:hover { background: rgba(255,255,255,.35); }
.profil-kutu { max-width: 420px; margin: 0 auto; background: #fff; border-radius: 18px; padding: 20px; box-shadow: 0 3px 12px rgba(0,0,0,.06); }
.profil-kutu label { display: block; font-weight: 700; font-size: 13px; color: #5c5f73; margin: 12px 0 6px; }
.profil-kutu input { width: 100%; border: 2px solid #dfe5f0; border-radius: 10px; padding: 10px 12px; font-size: 15px; font-family: inherit; }
.profil-kutu input:focus { outline: none; border-color: #9b59b6; }
.avatar-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.avatar-btn { border: 2px solid #dfe5f0; background: #fbfcfe; border-radius: 14px; font-size: 24px; padding: 6px 10px; cursor: pointer; }
.avatar-btn:hover { border-color: #9b59b6; }
.avatar-btn.secili { border-color: #9b59b6; background: #f3ecff; }
.gece-satir { display: flex; justify-content: space-between; align-items: center; margin: 14px 0; font-weight: 800; }
.gece-btn { border: none; border-radius: 20px; padding: 8px 16px; cursor: pointer; font-weight: 700; background: #6a5cff; color: #fff; }

/* ====== KARANLIK MOD ====== */
body.gece { background: #12151f; color: #e7eaf3; }
body.gece header { background: linear-gradient(135deg, #2b2660, #4a2f77); }
body.gece .tabs button.aktif { background: #12151f; color: #c3b2ff; }
body.gece .baslik p, body.gece .iller-puan, body.gece .alt, body.gece .kucuk-not, body.gece .arac small, body.gece .rozet-ac, body.gece .sayac-ad small, body.gece .geri { color: #9aa6c2; }
body.gece .ozet-karti, body.gece .ders-card, body.gece .unit, body.gece .quiz-kutu, body.gece .plan-gun,
body.gece .ilerleme-kutusu, body.gece .skor-liste, body.gece .durum-huc, body.gece .arac, body.gece .rozet,
body.gece .pomo-kutu, body.gece .sayac-kart, body.gece .kart, body.gece .harita-sinif, body.gece .lejant,
body.gece .sun-edit, body.gece .modal, body.gece .yanlis-kart, body.gece .profil-kutu, body.gece .takvim,
body.gece .gorev-satir { background: #1b2132 !important; box-shadow: 0 3px 12px rgba(0,0,0,.35); }
body.gece .secenek, body.gece .esle-btn, body.gece .zbut, body.gece .emoji-btn,
body.gece .sayac-ekle input, body.gece .profil-kutu input { background: #222a40; border-color: #38415c; color: #e7eaf3; }
body.gece .ozet-kutusu { background: #222a40; }
body.gece .konu-etiket { background: #2b3450; color: #b9c4e0; }
body.gece .kart-arka { background: #222a40; }
body.gece .kart-on { color: #b9a5ff; }
body.gece .plan-not { background: #3a3310; color: #ffe9a8; }
body.gece .durum-huc span { color: #b9a5ff; }
body.gece .durum-huc b, body.gece .seviye-satir, body.gece .hak-ust { color: #9aa6c2; }
body.gece .harita-huc.bo { background: #2b3450; color: #5c6a8a; }
body.gece .l-lej.bo { color: #4a5570; }
body.gece .rekor-bilgi { background: #222a40; }
body.gece .rekor-yeni { background: #3a3310; color: #ffe9a8; }
body.gece .secenek:hover, body.gece .esle-btn:hover { border-color: #9b59b6; }
body.gece .gorev-xp { background: #2b3450; color: #b9a5ff; }
body.gece .yanlis-duz { background: #222a40; border-color: #38415c; }
body.gece .takvim-huc.sifir { background: #2b3450; color: #5c6a8a; }
body.gece .takvim-not, body.gece .yanlis-ust small, body.gece .gorev-ilerleme { color: #9aa6c2; }
body.gece .avatar-btn { background: #222a40; border-color: #38415c; }
body.gece .avatar-btn.secili { border-color: #9b59b6; background: #2b3450; }

/* tema geçiş animasyonu */
body, header, .ozet-karti, .ders-card, .unit, .ilerleme-kutusu,
.skor-liste, .modal-icerik, .plan-gun, .form-kutu, .durum-huc,
.btn, .geri, .arac, .quiz-kutu, .sun-slide, .slayt-buyuk {
  transition: background-color 0.3s ease, color 0.3s ease,
              border-color 0.3s ease, box-shadow 0.3s ease;
}

/* ========== FEN DENEYLERİ ========== */
.deney-kutu { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.deney-kart { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid #e3e8f0; border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.gece .deney-kart { background: #20262f; border-color: #313b48; }
.deney-ikon { font-size: 34px; flex-shrink: 0; }
.deney-bilgi { flex: 1; min-width: 0; }

"## Harfler ve Alfabe\nTürk alfabesinde 29 harf vardır: 8 ünlü (sesli), 21 ünsüz (sessiz).\n- Ünlüler: a, e, ı, i, o, ö, u, ü (ağızdan engelsiz çıkar)\n- Ünsüzler: b, c, ç, d, f, g, ğ, h, j, k, l, m, n, p, r, s, ş, t, v, y, z\n- Alfabe sırası sözlük ve okul listeleri için önemlidir.\n## Heceler\n- Bir kelime hecelere ayrılır: kitap → ki-tap (3 harf 2 hece)\n- Kelime içindeki hece sayısı, kelimedeki ünlü harf sayısına eşittir: \"kalemlik\" → ka-lem-lik (3 ünlü → 3 hece)\n- Bir hecede en fazla 4 harf bulunur: \"Türk\", \"ay\" heceleri.\n## Ses Olayları\n- Ünlü düşmesi: burun-um → burnum\n- Ünlü daralması: bekle-yor → bekliyor\n- Ünsüz benzeşmesi (sertleşme): kitap-çı → kitapçı (p,ç,t,k sert)\n💡 Hece sayısı için ünlüleri say; \"satır sonuna sığmayan kelime hecesinden bölünür\".",

"## Öznel ve Nesnel Yargılar\n- Nesnel: ispatlanabilir, kişiden kişiye değişmez. \"Ankara, Türkiye'nin başkentidir.\"\n- Öznel: kişisel duygu ve düşünce taşır. \"Ankara çok soğuk bir şehirdir.\"\n## Neden-Sonuç Cümleleri\nBir olayın sebebini ve sonucunu bildirir.\n- \"Yağmur yağdığı için dışarı çıkamadık.\" → neden: yağmur, sonuç: çıkamamak.\n- Neden bağlaçları: için, çünkü, -den dolayı, -diği için.\n## Amaç-Sonuç Cümleleri\nBir işin hangi amaçla yapıldığını bildirir.\n- \"Bisiklet almak için para biriktiriyor.\" (amaç: bisiklet almak)\n## Koşul (Şart) Cümleleri\nBir durumun başka bir duruma bağlı olduğunu anlatır.\n- \"Çalışırsan başarılı olursun.\" → başarı, çalışmaya bağlı.\n## Karşılaştırma Cümleleri\nİki varlık veya durum kıyaslanır.\n- \"Ay, Dünya'dan daha küçüktür.\", \"Onun kadar hızlı koşamıyorum.\"\n✏️ \"için\" hem amaç hem neden olabilir: \"kazanmak için çalıştı\" (amaç), \"hastaydı, bu yüzden gelemem\" — dikkatle oku.",

"## İsim (Ad) Nedir?\nVarlıkları ve kavramları karşılayan sözcüklerdir: ağaç, sevgi, Ali, İstanbul.\n- Özel isim: tek bir varlığı gösterir, büyük harfle başlar: Ahmet, Türkiye.\n- Cins (tür) isim: aynı türden varlıkların ortak adı: kitap, şehir.\n- Somut isim: beş duyuyla algılanır: çiçek, müzik.\n- Soyut isim: algılanmaz, zihinde var olur: mutluluk, özgürlük.\n## Sıfat (Ön Ad) Nedir?\nİsimleri niteleyen veya belirten sözcüklerdir.\n- Niteleme sıfatı: \"Nasıl?\" der: mavi göz, uzun yol.\n- Belirtme sıfatları: İşaret (bu ev), sayı (iki kardeş), belgisiz (bazı günler), soru (hangi kitap).\n✏️ Sıfat, ismin önünde durur: \"kırmızı elma\" — kırmızı sıfat, elma isim.",

"## Yüklem\nCümlede işi, oluşu, durumu bildiren ögedir; cümlenin temel taşıdır.\n- \"Ayşe kitap okuyor.\" → yüklem: okuyor.\n- Yüklem fiil (okuyor, gitti) ya da ek fiil almış isim (\"hastadır\") olabilir.\n## Özne\nYüklemin bildirdiği işi yapan ya da durumda olan varlıktır.\n- \"Ayşe kitap okuyor.\" → özne: Ayşe (kim okuyor?)\n## Nesne\nYüklemdeki işten etkilenen ögedir. \"Ne? / Neyi? / Kimi?\" sorularına cevap verir.\n- \"Ayşe kitap okuyor.\" → nesne: kitap (neyi okuyor?)\n## Yer ve Zaman Tümleci\n\"Nerede? Nereye? Nereden? Ne zaman? Nasıl?\" sorularına cevap verir.\n- \"Sabah okula gitti.\" → sabah: zaman, okula: yer.\n✏️ Önce yüklemi bul, sonra \"kim/ne?\" → özne, \"neyi?\" → nesne, gerisi tümleç.",

"## Büyük Harfler\nCümle başında, özel adlarda (Türkiye, Ali), kurum ve yer adlarında büyük harf kullanılır.\n- \"Dün Ankara'dan geldik.\"\n## 'de / 'da ve 'ki' Yazımı\n- Bağlaç olan de/da ayrı yazılır: \"Sen de gel.\" (çıkarılınca anlam bozulmaz)\n- Ek olan -de/-da bitişik: \"Evde kaldım.\" (çıkarılınca anlam bozulur)\n- Bağlaç ki ayrı: \"Gördüm ki gelmiş.\" / Ek -ki bitişik: \"seninki\", \"bahçedeki\".\n## Noktalama İşaretleri\n- Nokta (.): cümle sonu, kısaltmalar.\n- Virgül (,): sıralama ve ara sözlerde.\n- Soru (?) ve ünlem (!): soru ve duygu cümlelerinde.\n- İki nokta (:): açıklama öncesi.\n✏️ \"de\"yi cümleden çıkar, anlam bozulmuyorsa bağlaç → ayrı yaz.",

"## Zihinden İşlemler\nSayıları çözümleyerek zihinden toplayıp çıkarırız: 48 + 27 = 48 + 20 + 7 = 75.\n## Tahmin Etme\nSayıları yuvarlayarak yaklaşık sonuç bulma: 43 × 8 ≈ 40 × 8 = 320.\n- Tahmin sonucun yaklaşık olduğu unutulmamalıdır.\n## Çarpma ve Bölme\n- Çarpma: tekrarlı toplamadır. 12 × 4 = 12+12+12+12 = 48.\n- 10, 100, 1000 ile çarpma: sona sıfır eklenir (12 × 10 = 120).\n- Bölme: eşit paylaştırma. 36 ÷ 4 = 9.\n## İşlem Önceliği\nSırayla: parantez → çarpma/bölme → toplama/çıkarma.\n- 2 + 3 × 4 = 2 + 12 = 14\n- (2 + 3) × 4 = 5 × 4 = 20\n✏️ \"Parantez yoksa önce çarpma-bölme, sonra toplama-çıkarma.\"",

// 2 Kesirler
"## Kesir Nedir?\nBir bütünün eş parçalarından kaç parça aldığımızı gösterir: pay / payda.\n- 3/5: bütün 5 eş parçaya bölünmüş, 3'ü alınmış.\n- Birim kesir: payı 1 olan kesir: 1/2, 1/5.\n## Kesir Çeşitleri\n- Basit kesir: payı paydasından küçük: 2/3.\n- Bileşik kesir: payı paydasından büyük ya da eşit: 5/3.\n- Tam sayılı kesir: tam kısımlı: 1 2/3.\n## Sayı Doğrusunda Kesirler\nBütün 0 ile 1 arasında, eş parçalara bölünerek gösterilir.\n- 1/4, sayı doğrusunda 0 ile 1 arasının 1. parçasıdır.\n## Kesirleri Karşılaştırma\n- Paydası aynı olanlarda payı büyük olan büyüktür.\n- Payı aynı olanlarda paydası küçük olan büyüktür: 1/3 > 1/5.\n✏️ Birim kesirlerde payda büyüdükçe parça küçülür: 1/8, 1/4'ten küçüktür.",

// 3 Kesirlerle İşlemler
"## Toplama ve Çıkarma\nPaydalar eşitse paylar toplanır/çıkarılır, payda değişmez.\n- 2/7 + 3/7 = 5/7\nPaydalar farklıysa genişletilerek eşitlenir.\n- 1/2 + 1/4 = 2/4 + 1/4 = 3/4\n## Kesir Problemleri\nProblemleri modelle çözmek kolaylaştırır:\n- \"Bir pastanın 2/8'i yenildi, 3/8'i yenildi; toplam 5/8 yenilmiştir.\"\n## Modelle Öğrenme\nŞekiller eş parçalara bölünür; boyanan parçalar kesri gösterir.\n✏️ Toplama/çıkarmada paydaları eşitle; sonucu sadeleştirmeyi unutma: 4/8 = 1/2.",

// 4 Ondalık Gösterim
"## Onda Bir ve Yüzde Bir\n- Onda bir: 1/10 = 0,1\n- Yüzde bir: 1/100 = 0,01\n- 0,3 → üç onda bir; 0,25 → yirmi beş yüzde bir.\n## Ondalık Sayılarla İşlemler\nToplama-çıkarmada virgüller alt alta getirilir.\n- 2,4 + 1,35 = 3,75\n## Sayı Doğrusunda Gösterme\n0 ile 1 arası 10 eş parçaya bölünürse her parça 0,1'dir.\n## Kesirle İlişki\n- 0,5 = 5/10 = 1/2\n- 0,75 = 75/100 = 3/4\n✏️ Ondalık gösterimi okurken \"virgül\" yerine \"tam\" denir: 2,4 → 2 tam 4 onda bir.",

// 5 Yüzdeler
"## Yüzde (%)\nPaydası 100 olan kesirlerin özel gösterimidir.\n- %25 = 25/100 = 1/4\n- %50 = 50/100 = 1/2\n## Modelle Gösterme\n100 eş parçaya bölünmüş şekilde boyanan parça sayısı yüzdeyi verir.\n- 100 parçanın 20'si boyandıysa %20.\n## Yüzde Hesaplamaları\nBir sayının yüzdesi: sayı × yüzde / 100.\n- 200'ün %25'i = 200 × 25 ÷ 100 = 50\n- 80'in %10'u = 8\n✏️ %10 hesaplamanın kısa yolu: sayıyı 10'a böl. %50 için 2'ye böl.",

// 6 Temel Geometrik Kavramlar
"## Nokta, Doğru, Işın\n- Nokta: yeri belirten, boyutu olmayan kavramdır.\n- Doğru: iki yönde sonsuza uzayan, düz çizgidir.\n- Işın: başlangıç noktası olan, bir yöne sonsuz uzayan çizgidir.\n- Doğru parçası: iki ucu belli olan düz çizgidir.\n## Dik ve Paralel Doğrular\n- Dik doğrular: birbirini 90° açıyla keser.\n- Paralel doğrular: asla kesişmez, aynı yöne gider.\n## Açılar\nAçı, iki ışının ortak noktada (köşe) oluşturduğu şekildir.\n- Dar açı: < 90°, Dik açı: 90°, Geniş açı: > 90°.\n- Açı ölçer (iletki) ile ölçülür, birimi derecedir (°).\n✏️ Karede köşeler 90°, kenarlar diktir; karşılıklı kenarlar paraleldir.",

// 7 Üçgen ve Dörtgenler
"## Üçgen Çeşitleri\nKenarlarına göre: eşkenar (3 kenar eşit), ikizkenar (2 kenar eşit), çeşitkenar (hepsi farklı).\nAçılarına göre: dar açılı, dik açılı, geniş açılı.\n- Üçgenin iç açıları toplamı 180°'dir.\n## Dörtgenler\n- Kare: 4 kenarı ve 4 açısı eşit (90°).\n- Dikdörtgen: karşılıklı kenarlar eşit, 90°.\n- Paralelkenar: karşılıklı kenarlar paralel ve eşit.\n- Eşkenar dörtgen: 4 kenarı eşit, karşılıklı açılar eşit.\n- Yamuk: sadece bir çift kenarı paraleldir.\n- Dörtgenin iç açıları toplamı 360°'dir.\n## Çevre Bulma\nÇevre, kenar uzunluklarının toplamıdır.\n- Kare: 4 × kenar; dikdörtgen: 2 × (kısa + uzun kenar).\n✏️ Çevre için tüm kenarları topla; şeklin dışının uzunluğudur.",

// 8 Veri İşleme
"## Veri Nedir?\nBir konu hakkında toplanan bilgi ve sayılardır.\n- Anket, sayım ve gözlemle veri toplanır.\n## Sıklık Tablosu\nVerilerin kaç kez tekrar ettiğini gösterir.\n- \"En sevilen meyve\" anketi: elma 5, muz 3... → elma en çok tercih edilen.\n## Sütun Grafiği\nVerileri dikey veya yatay çubuklarla gösterir; karşılaştırmayı kolaylaştırır.\n- Grafikten en çok/en az ve fark okunabilir.\n💡 Grafik okurken sütun yüksekliklerine bak; aynı veri farklı gösterimlere dönüştürülebilir.",

// 9 Uzunluk, Alan ve Zaman
"## Uzunluk Ölçüleri\nTemel birim metredir (m): km > hm > dam > m > dm > cm > mm.\n- 1 km = 1000 m, 1 m = 100 cm, 1 cm = 10 mm.\n- Aşağı inerken 10 ile çarpılır, yukarı çıkarken 10'a bölünür.\n## Alan\nAlan, yüzeyin kapladığı bölgedir; birim kareyle ölçülür (cm², m²).\n- Dikdörtgenin alanı = kısa kenar × uzun kenar.\n- Karenin alanı = kenar × kenar.\n- 1 m² = 10 000 cm² (alan birimleri 100'ün katlarıdır).\n## Zaman Birimleri\n1 yıl = 12 ay, 1 ay ≈ 4 hafta, 1 hafta = 7 gün, 1 gün = 24 saat.\n- 1 saat = 60 dk, 1 dk = 60 sn.\n✏️ Uzunlukta 10 ile, alanda 100 ile çarpılır; saniye→dakika→saat çevriminde 60 kullanılır.",

// 10 Geometrik Cisimler
"## Küp ve Dikdörtgenler Prizması\n- Küp: 6 yüzü kare, 12 ayrıtı eşit.\n- Dikdörtgenler prizması: 6 dikdörtgen yüz, 12 ayrıt, 8 köşe.\n## Yüz, Ayrıt, Köşe\n- Yüz: cismi sınırlayan düzlem parçaları.\n- Ayrıt: iki yüzün kesiştiği çizgi.\n- Köşe: ayrıtların kesiştiği nokta.\n## Açınım\nPrizmanın yüzlerinin açılıp düzleme çizilmiş halidir.\n- Küpün açınımı 6 kareden oluşur (çarpı şeklinde).\n💡 Prizmaları inceleyen \"yüzleri, ayrıtları ve köşeleri sayarak\" özelliklerini karşılaştır."
],

/* ===================== FEN BİLİMLERİ ===================== */
fen5: [
// 0 Güneş, Dünya ve Ay
"## Güneş'in Yapısı\nGüneş, Dünya'ya en yakın yıldızdır; kendi ışığını ve ısısını üretir.\n- Isı ve ışık kaynağıdır; çok büyüktür ama Dünya'ya uzak olduğu için küçük görünür.\n## Dünya'nın Yapısı\n- Dıştan içe: kabuk, manto, çekirdek.\n- Yüzeyinin çoğu sularla kaplıdır (su küre); etrafında gazlardan oluşan atmosfer vardır.\n- Dünya, hem kendi ekseni etrafında döner (gece-gündüz) hem Güneş'in etrafında dolanır (mevsimler).\n## Ay'ın Yapısı\nAy, Dünya'nın tek doğal uydusudur; kendi ışığı yoktur, Güneş'ten aldığı ışığı yansıtır.\n- Atmosferi yok denecek kadar azdır; yüzeyinde kraterler bulunur.\n## Gök Cisimleri\nYıldızlar (kendi ışığı), gezegenler (yıldızın etrafında dolanır), uydular (gezegenin etrafında dolanır).\n✏️ Yıldızlar ışık üretir, gezegenler ve uydular yansıtır. Ay yüzeyindeki lekeler kraterdir.",

// 1 Canlılar Dünyası
"## Canlıların Ortak Özellikleri\nBeslenme, solunum, boşaltım, hareket, büyüme-gelişme ve üreme.\n## Bitkiler\nKendi besinini fotosentezle üretir (üretici).\n- Kök (su emer), gövde (taşır), yaprak (fotosentez), çiçek (üreme).\n## Hayvanlar\nBesinini dışarıdan alır (tüketici).\n- Omurgalılar: balık, kurbağa, sürüngen, kuş, memeli.\n- Omurgasızlar: böcekler, örümcekler, salyangozlar.\n## Mikroskobik Canlılar\nGözle görülemeyecek kadar küçük canlılar (bakteri, virüs, amip).\n- Bazıları yararlıdır (peynir, yoğurt, ilaç), bazıları hastalık yapar.\n- Mikroskopla gözlenir.\n✏️ Bitkiler kendi besinini üretir (üretici), hayvanlar tüketir; mikropların hepsi zararlı değildir.",

// 2 Kuvvetin Ölçülmesi
"## Kuvvet Nedir?\nCisimleri iten, çeken, hızlandıran, durduran ve şeklini değiştiren etkidir.\n- Kuvvetin etkileri: hareket ettirme, durdurma, yön değiştirme, şekil değiştirme.\n## Kuvvetin Ölçülmesi: Dinamometre\nKuvvet, dinamometre ile ölçülür; birimi Newton (N) veya kilogram-kuvvettir (kgf).\n- Dinamometrenin içindeki yay, kuvvet arttıkça daha çok esner.\n- Yayların kalınlığı farklı olduğu için her dinamometrenin ölçüm sınırı farklıdır.\n## Sürtünme Kuvveti\nHareket eden cisme hareketin tersi yönde etki eden kuvvettir.\n- Cismi yavaşlatır; pürüzlü yüzeylerde daha büyüktür.\n- Günlük hayat: fren yapan araba, silinen silgi.\n✏️ Dinamometre yayı ne kadar uzarsa kuvvet o kadar büyüktür; Newton'un işareti N'dir.",

// 3 Madde ve Değişim
"## Maddenin Halleri\nMadde doğada katı, sıvı ve gaz hâlinde bulunur.\n- Katı: belirli şekli ve hacmi vardır.\n- Sıvı: belirli hacmi var, belirli şekli yoktur (bulunduğu kabın şeklini alır).\n- Gaz: belirli şekli ve hacmi yoktur; sıkıştırılabilir.\n## Hal Değişimi\nIsı alınca veya verilince maddenin hâli değişir:\n- Erime: katı → sıvı (buz erir, ısı alır).\n- Donma: sıvı → katı (su donar, ısı verir).\n- Buharlaşma: sıvı → gaz (su buharlaşır, ısı alır).\n- Yoğuşma: gaz → sıvı (buhar yoğuşur, ısı verir).\n- Süblimleşme: katı → gaz (naftalin).\n## Erime ve Kaynama Noktası\n- Erime noktası: saf maddenin eridiği sıcaklık (buz: 0°C).\n- Kaynama noktası: sıvının kaynadığı sıcaklık (su: 100°C).\n✏️ Hal değişimi sırasında maddenin kütlesi değişmez; ısı alışverişi sürer.",

// 4 Işığın Yayılması
"## Işık Kaynakları\n- Doğal: Güneş, yıldız, ateş böceği.\n- Yapay: ampul, mum, lamba.\n## Işığın Yolculuğu\nIşık doğrusal yolla yayılır; boşlukta ve saydam ortamlarda ilerler.\n- Saydam: ışığı geçirir (cam).\n- Yarı saydam: az geçirir (buzlu cam).\n- Opak: geçirmez (tahta, metal).\n## Yansıma\nIşık, parlak yüzeylerden geri döner. Düz aynada görüntü oluşur.\n- Gelme açısı = yansıma açısı.\n## Gölge Oluşumu\nIşık opak cisimlere çarpınca cismin arkasında gölge oluşur.\n- Işık kaynağı cisme yaklaşırsa gölge büyür.\n- Gölgenin şekli cismin şekline benzer.\n✏️ Gölgenin olması, ışığın doğrusal yayıldığının kanıtıdır.",

// 5 İnsan ve Çevre
"## Doğal ve Yapay Çevre\n- Doğal çevre: insan eli değmemiş (orman, göl).\n- Yapay çevre: insan yapımı (bahçe, park, oyun alanı).\n## Kaynakları Koruma\nSu, toprak ve enerji kaynakları sınırlıdır.\n- Suyu tasarruflu kullan, muslukları kapat.\n- Geri dönüşümle atıkları yeniden değerlendir (kâğıt, cam, metal, plastik).\n## Çevre Kirliliği\nHava, su, toprak ve gürültü kirliliği canlılara zarar verir.\n- Çöpleri çöp kutusuna at, doğaya çöp bırakma.\n- Erozyon ve orman yangınları toprak ve bitki örtüsüne zarar verir.\n✏️ \"Temiz çevre sağlıklı yaşam\" demektir; küçük bir çevreci de sen olabilirsin.",

// 6 Elektrik Devreleri
"## Devre Elemanları\n- Pil: elektrik enerjisi sağlar (kaynak).\n- Ampul: elektrik enerjisini ışığa çevirir (alıcı).\n- Anahtar: devreyi açar ve kapatır.\n- Bağlantı kablosu: elektriği taşır.\n## Basit Elektrik Devresi\nPil + kablo + ampul + anahtar birleştirilerek devre kurulur.\n## Açık ve Kapalı Devre\n- Kapalı devre: akım geçer, ampul yanar.\n- Açık devre: akım geçmez (anahtar kapalı değil), ampul yanmaz.\n✏️ Ampulün yanması için devrenin kapalı ve eksiksiz olması gerekir."
],

/* ===================== SOSYAL BİLGİLER ===================== */
sos5: [
// 0 Birey ve Toplum
"## Birey Olma\nHer insan benzersizdir; bizi anlatan özelliklere bireysel özellikler denir.\n- Fiziksel özellikler (boy, saç), kişisel özellikler (yardımsever, çalışkan).\n## Haklarımız\nKanunlarla güvence altına alınmış istek ve özgürlüklerimizdir.\n- Öğrenme hakkı, oyun oynama hakkı, fikir söyleme hakkı.\n## Sorumluluklarımız\nHaklarımızı kullanırken üstlendiğimiz görevlerdir.\n- Ödev yapmak, kurallara uymak, arkadaşlarımıza saygı göstermek.\n- Hak ve sorumluluk denge içinde olmalıdır.\n## Rollerimiz\nAilede çocuk, okulda öğrenci, takımda oyuncu olmak gibi farklı rollerimiz vardır.\n💡 \"Benim hakkım var\" derken başkalarının haklarına da saygı göstermeliyiz.",

// 1 Kültür ve Toplum
"## Milli Kültür\nBir toplumu diğerlerinden ayıran maddi ve manevi değerlerin bütünüdür.\n- Dil, din, tarih, gelenek, yemekler, türküler, el sanatları.\n## Kültürel Değerler\nBayramlar, düğünler, misafirperverlik, büyüklere saygı kültürümüzün parçasıdır.\n- Millî bayramlarımız (23 Nisan, 29 Ekim) birlik ve beraberliği güçlendirir.\n- Dinî bayramlar sevgi, paylaşma ve yardımlaşmayı artırır.\n## Kültürel Miras\nGeçmişten bize kalan eserler ve değerler korunmalıdır.\n- Müzeler, tarihi yapılar, el sanatları.\n💡 Kültürü gelecek nesillere aktarmak için dilimize, geleneklerimize ve eserlerimize sahip çıkarız.",

// 2 İnsanlar, Yerler ve Çevreler
"## Harita Okuma\nHarita, yeryüzünün kuş bakışı küçültülmüş çizimidir.\n- Lejant (işaretler anahtarı), yön oku ve ölçek haritanın temel ögeleridir.\n## Yön Bulma\n- Ana yönler: kuzey, güney, doğu, batı.\n- Pusula ibresi her zaman kuzeyi gösterir.\n## İklim ve Yaşam\nİklim, bir yerde uzun yıllar görülen ortalama hava durumudur.\n- İklim, giyimi, tarımı, konutları ve yaşam biçimini etkiler.\n## Doğal Afetler\nDeprem, sel, çığ, erozyon gibi afetlerden korunmak için hazırlıklı olmalıyız.\n- Deprem çantası, güvenli bina, afet tatbikatları.\n💡 Harita okurken önce lejanta bak; yön için pusula veya Güneş'in doğuşu/batışı kullanılabilir.",

// 3 Bilim, Teknoloji ve Toplum
"## Önemli İcatlar\nİcatlar, hayatı kolaylaştıran yeni buluşlardır.\n- Tekerlek (ulaşım), yazı (bilgi aktarımı), pusula (yön bulma), matbaa (bilgi yayımı).\n## Teknoloji Kullanımı\nTelefon, bilgisayar ve internet hayatı kolaylaştırır.\n- Doğru ve ölçülü kullanmak önemlidir; uzun süre ekrana bakmak sağlığa zarar verir.\n## Dijital Güvenlik\n- Kişisel bilgileri (adres, okul, telefon) internette paylaşma.\n- Tanımadığın kişilerle bilgi paylaşma; güçlü parola kullan.\n✏️ Teknoloji iyi bir araçtır; ama onu doğru, güvenli ve dengeli kullanmak bizim sorumluluğumuzdur.",

// 4 Üretim ve Tüketim
"## Üretim\nHam maddelerin emek ve sermaye ile tüketilebilir ürüne dönüştürülmesidir.\n- Örnek: pamuk → iplik → kumaş → elbise.\n## Tüketim\nÜretilen ürünlerin ihtiyaçları karşılamak için kullanılmasıdır.\n## Bilinçli Tüketim\n- İhtiyaç ve isteği ayırt et.\n- Etiket ve son kullanma tarihini kontrol et; kaliteli ve ihtiyacın olanı al.\n## Tasarruf\nKaynakları ve parayı gerektiği kadar kullanmaktır.\n- Suyu, elektriği ve yiyecekleri israf etmemek.\n💡 \"İhtiyacın kadar al, israf etme\" — bilinçli tüketicinin en temel kuralı.",

// 5 Vatandaşlık ve Haklarımız
"## Vatandaşlık\nBir devlete yasal bağlılık, o devletin vatandaşı olmaktır.\n- Vatandaşın hakları olduğu kadar sorumlulukları da vardır.\n## Cumhuriyet\nHalkın kendi yöneticilerini seçtiği yönetim biçimidir.\n- 29 Ekim 1923'te Cumhuriyet ilan edildi.\n## Demokrasi\nHalkın kendini yönettiği, seçme ve seçilme hakkının olduğu yönetimdir.\n- Eşitlik, özgürlük, adalet temel ilkelerdir.\n## Çocuk Hakları\nHer çocuğun yaşama, eğitim, sağlık, oyun ve korunma hakları vardır.\n- Çocuk hakları uluslararası sözleşmelerle güvence altındadır.\n✏️ Haklarımızı bilmek ve kullanmak, sorumluluklarımızı yerine getirmekle mümkündür.",

// 6 Küresel Bağlantı
"## Kıtalar ve Ülkeler\nDünyada 7 kıta ve yüzlerce ülke vardır.\n- Türkiye, Asya ile Avrupa arasında köprü konumundadır.\n## Ulaşım ve İletişim\nUçak, gemi, tren ve internet sayesinde ülkeler birbirine yakınlaşmıştır.\n- Bir ülkede üretilen ürünler dünyanın her yerine ulaşabilir.\n## Dünya ile İş Birliği\nÜlkeler; spor, ticaret, kültür ve çevre konularında iş birliği yapar.\n- Turizm, kültürel etkileşimi ve dostluğu artırır.\n💡 Dünya artık küçük bir köy gibidir; iş birliği herkesin yararınadır."
],

/* ===================== İNGİLİZCE ===================== */
ing5: [
// 0 Hello! – Tanışma
"## Selamlaşma\n- Hello! / Hi! (Merhaba!)\n- Good morning! (Günaydın!), Good afternoon! (İyi günler!), Good evening! (İyi akşamlar!)\n- Goodbye! (Güle güle!)\n## Kendini Tanıtma\n- My name is Eymen. (Benim adım Eymen.)\n- I am ten years old. (10 yaşındayım.)\n- I am from Türkiye. (Türkiye'denim.)\n## Tanışma Soruları\n- What's your name? (Adın ne?)\n- How old are you? (Kaç yaşındasın?)\n- Where are you from? (Nerelisin?)\n✏️ \"I am\" = ben...ım/ım; soru kalıplarını \"What / How / Where\" ile kur.",

// 1 My Town – Şehrim
"## Şehirdeki Yerler\nschool (okul), hospital (hastane), library (kütüphane), park, market, bakery (fırın), bank, post office.\n## Yer Sorma ve Söyleme\n- Where is the library? (Kütüphane nerede?)\n- It's near the school. (Okulun yakınında.)\n- It's next to the park. (Parkın yanında.)\n- It's in front of the bank. (Bankanın önünde.)\n## Yönler\nleft (sol), right (sağ), go straight (düz git), turn left (sola dön).\n✏️ \"near\" yakınında, \"next to\" hemen yanında, \"in front of\" önünde anlamına gelir.",

// 2 Games and Hobbies – Oyunlar ve Hobiler

"## Gerçek, Mecaz ve Terim Anlam\nBir sözcüğün sözlükteki ilk anlamına gerçek anlam denir. Kelimeyi bilinen anlamının dışında kullanırsak mecaz anlam ortaya çıkar.\n- Gerçek anlam: \"Ayağım çok ağrıyor.\" (vücudumuzun bölümü)\n- Mecaz anlam: \"Bugün ağır bir ders işledik.\" (zor, sıkıcı)\n- Terim anlam: Bilim, sanat ve spor alanlarına özel anlamlar: \"açı\", \"kök\", \"maç\" gibi.\n💡 Bir kelimenin terim anlamı, o alanda uzman olmayanın bilmeyebileceği özel anlamıdır: \"kedi sesi\"ndeki ses genel, \"dil bilgisinde ünlü ses\" terimdir.\n## Sesteş Sözcükler\nYazılışı ve okunuşu aynı, anlamı farklı sözcüklere sesteş denir: \"yüz\" (sayı), \"yüz\" (vücut bölümü), \"yüz\" (yüzmek).\n## Deyimler ve Atasözleri\n- Deyim: En az iki sözcükten oluşan, mecaz anlamlı kalıplaşmış ifade: \"Gözü gibi bakmak\", \"Burnundan solumak\".\n- Atasözü: Atalarımızın deneyimlerini anlatan öğüt veren kalıplaşmış sözler: \"Sakla samanı, gelir zamanı.\"\n✏️ Deyimlerin çoğu mecaz anlamlıdır; atasözleri ise genellikle bir yargı, ders verir.",

"## Öznel ve Nesnel Yargı\n- Nesnel yargı: Kişiden kişiye değişmez, herkes için aynı olan bilgi. \"Dünya, Güneş'in etrafında döner.\"\n- Öznel yargı: Kişinin duygu ve düşüncesine göre değişir. \"En güzel mevsim sonbahardır.\"\n💡 Nesnel cümleler ispatlanabilir, öznel cümleler ispatlanamaz. \"Kutup ayıları et yer.\" (nesnel) / \"Kediler çok sevimlidir.\" (öznel)\n## Neden – Sonuç (Sebep) Cümleleri\nBir olayın gerçekleşme sebebini bildiren cümlelerdir. \"Neden?\" sorusuna cevap verir.\n- \"Yağmur yağdığı için maç iptal oldu.\" (neden: yağmur / sonuç: maçın iptali)\n- Neden sözcükleri: için, çünkü, -den dolayı, -diği için.\n## Amaç – Sonuç Cümleleri\nGerçekleşme amacı bildirir; \"hangi amaçla?\" sorusuna cevap verir.\n- \"Sınavı kazanmak için çok çalıştı.\" (amaç: kazanmak)\n- Amaç sözcükleri: için, üzere, diye.\n## Koşul (Şart) Cümleleri\nBir durumun gerçekleşmesi başka bir şarta bağlıdır.\n- \"Ödevini bitirirse oyuna çıkabilir.\"\n- Koşul ekleri ve sözcükleri: -se/-sa, ise, yeter ki, ama, ancak.\n✏️ \"Sınavı kazanmak için çok çalıştı\" amaç; \"çok çalıştığı için kazandı\" neden-sonuçtur. Ayrım: sonuç mu ulaşılmak istenen hedef, yoksa gerçekleşmiş olay mı?",

"## Kök Nedir?\nKöy = Kelimenin anlam taşıyan, parçalanamayan çekirdeğidir.\n- \"kalemlik\" kelimesinin kökü \"kalem\"dir.\n- Kökün türü: isim kökü (kalem, ev, taş) ve fiil kökü (koş-, sev-, gül-). Fiil kökleri \"-mak\" takısı alabilir: koşmak.\n## Yapım Ekleri\nYeni kelime türeten eklerdir; kelimenin anlamını değiştirir.\n- \"göz-lük\", \"süt-çü\", \"yaz-lık\", \"sev-gi\"\n- Yapım eki alan kelimeye gövde denir.\n## Çekim Ekleri\nKelimenin anlamını değiştirmez; görevini belirler, çoğul yapar veya durum bildirir.\n- Çoğul eki: -ler/-lar (kitap-lar)\n- İyelik eki: -im, -in (kalem-im)\n- Hâl ekleri: -i, -e, -de, -den (ev-i, ev-e, ev-de, ev-den)\n- Fiil çekim ekleri: zaman ve kişi ekleri (gel-di-m)\n✏️ Kökü bulmak için ekleri ayırdıktan sonra kalan kısım anlamlı olmalıdır: \"bilgiç\" → bil- (fiil kökü) + -giç (yapım eki).",

"## \"de\" ve \"da\" Yazımı\n- Ayrı yazılır: \"bağlaç olan de/da\" → \"Sen de gel.\", \"Ali de gördü.\" (cümleden çıkarılırsa anlam bozulmaz)\n- Bitişik yazılır: \"hâl eki olan -de/-da\" → \"Evde kaldım.\", \"Okulda buluştuk.\" (cümleden çıkarılırsa anlam bozulur)\n- Bağlaç olan de/da hiçbir zaman \"te/ta\" biçiminde yazılmaz: \"Evde mi?\" → \"Sen de mi?\", \"Kitapta değil.\" → \"Kitap da değil.\"\n## \"ki\" Yazımı\n- Bağlaç olan ki ayrı yazılır: \"Gördüm ki gelmiş.\"\n- Ek olan -ki bitişik yazılır: \"sende-ki\", \"bahçe-deki\", \"yarınki\".\n- Kalıplaşmış sözcükler: belki, çünkü, sanki, mademki, oysaki bitişiktir.\n## Büyük Harflerin Kullanımı\nCümle başında, özel adlarda (Türkiye, Ayşe, Van), kurum adlarında büyük harf kullanılır.\n## Noktalama İşaretleri\n- Nokta (.): bitmiş cümle ve kısaltmalarda.\n- Virgül (,): eş görevli sözcükleri ve sıralı cümleleri ayırır.\n- Soru işareti (?): soru cümlesinin sonunda.\n- Ünlem (!): sevinç, korku, şaşkınlık bildiren cümlelerde.\n- İki nokta (:) açıklama ve listeleme öncesinde.\n✏️ \"Kitap + da\" bitişik; \"kitap da aldım\" bağlaç, ayrı. Kulağını test et: \"de\"yi çıkar, anlam bozuluyorsa ek (bitişik).",

"## Metin Türleri\n- Hikâye (öykü): Olay anlatır. Giriş, gelişme, sonuç bölümleri; kahramanlar ve yer-zaman vardır.\n- Bilgilendirici metin: Bilgi vermek, öğretmek için yazılır. Makale, deneme, gezi yazısı, anı gibi türler.\n- Şiir: Duyguları ölçü, uyak ve ritimle anlatır.\n- Masal, fabl, efsane: Olağanüstü olayların anlatıldığı edebi türler.\n## Hikâye Unsurları\n- Olay: Yaşanan ya da yaşanabilecek durum.\n- Kişi (kahraman): Olayın başkahramanı ve diğer karakterler.\n- Yer: Olayın geçtiği mekân.\n- Zaman: Olayın yaşandığı zaman dilimi.\n- Anlatıcı: Olayı anlatan kişi.\n## Konu, Başlık ve Ana Fikir\n- Konu: Metinde anlatılan şey (\"Kısa ve öz cevapla: Metin ne anlatıyor?\")\n- Ana fikir: Metnin vermek istediği temel mesaj, asıl düşünce.\n- Başlık: Metnin içeriğini en iyi özetleyen sözcük grubu.\n💡 Ana fikri bulmak için sor: \"Yazar, okura hangi mesajı vermek istiyor?\" Cevap çoğu zaman tek cümledir.",

"## Paragraf Nedir?\nBir düşünceyi bütünlük içinde anlatan cümle topluluğudur. Giriş, gelişme ve sonuç cümleleri vardır.\n- Giriş cümlesi: Düşünceyi tanıtır, geneldir.\n- Gelişme cümleleri: Düşünceyi örnek ve ayrıntılarla açıklar.\n- Sonuç cümlesi: Düşünceyi toparlar, özetler.\n## Anlatım Türleri\n- Açıklama: Bilgi verir, öğretir. \"Soru işareti, soru cümlelerinin sonuna konur.\"\n- Tartışma: Bir düşünceyi savunur, karşı görüşü çürütür.\n- Betimleme: Varlıkları sözcüklerle resim çizer gibi anlatır (görsel ayrıntı).\n- Öyküleme: Olayları akış içinde anlatır.\n## Düşünceyi Geliştirme Yolları\nTanımlama, örneklendirme, tanık gösterme, benzetme, karşılaştırma ve sayısal verilerden yararlanma.\n✏️ Yazarken önce plan yap: giriş → gelişme → sonuç. Sonra anlatım türünü seç, örneklerle destekle.",

"## Yargı Sayısına Göre Cümleler\n- Basit cümle: Tek yargı (tek yüklem). \"Kardeşim her sabah erken kalkar.\"\n- Sıralı cümle: Birden çok bağımsız yargı virgül veya noktalı virgülle sıralanır. \"Geldi, oturdu, anlattı.\"\n- Birleşik cümle: Tek ana yargı + onu tamamlayan yan yargı(lar). \"Sınava girmeden önce kısa bir özet yaptım.\"\n💡 Yüklem sayısına bak: tek yüklem varsa basit, birden çok yüklem varsa sıralı ya da birleşik.\n## Yüklemin Yerine ve Anlamına Göre\n- Kurallı cümle: Yüklem sonda. \"Yağmur dinmeden yola çıktık.\"\n- Devrik cümle: Yüklem sonda değildir. \"Çıktık yola yağmur dinmeden.\"\n- Olumlu / olumsuz / soru cümleleri de anlamlarına göre gruplandırılır.\n✏️ \"Yağmur yağınca ıslandık.\" → \"yağınca\" yan yargı, \"ıslandık\" ana yargı: birleşik cümle.",

"## Gereksiz Sözcük Kullanımı\nAnlamı zaten başka bir sözcükte olan sözcükler cümleye eklenirse bozukluk olur.\n- Yanlış: \"Dışarıda kar yağmaktadır.\" → \"Kar\" zaten \"yağar\"; \"Dışarıda kar yağıyor.\" olmalı.\n- Yanlış: \"Bütün hepsi geldi.\" → \"Bütün\" ve \"hepsi\" aynı anlamda.\n## Anlamdaş / Yakın Anlamlı Sözcüklerin Bir Arada Kullanımı\n\"Zaten o da aynı şekilde bu duruma karşı çıktı.\" → \"zaten\", \"aynı şekilde\" gereksizdir.\n## Yanlış Anlamda Sözcük\nKelimenin cümleye uymayan anlamda kullanılması: \"Televizyonun sesini yükseltti.\" değil \"sesini açtı\" (anlam bağlamına dikkat).\n## Mantık ve Yapı Hataları\n- Çelişki: \"Kesinlikle belki gelir.\" → \"kesinlikle\" ile \"belki\" çelişir.\n- Deyimin yanlış kullanımı: \"Eli açık davrandı\" yerine \"cömert davrandı\" gibi anlam karışıklığı.\n💡 Bozukluğu bulmak için cümleyi yavaşça oku; anlamsız tekrar, çelişki ya da eksik öge ara.",

"## Üslü İfadeler\nBir sayının kendisiyle tekrar tekrar çarpılmasını kısa gösterimi: taban × üs.\n- 2³ = 2 × 2 × 2 = 8 (taban 2, üs 3)\n- 5² = 5 × 5 = 25\n- 10⁶ = 1 000 000 (10'un kuvvetleri kolay: 1'in yanına üs kadar 0)\n💡 1'in her kuvveti 1'dir; taban 10 ise üs, sıfır sayısını verir.\n## İşlem Önceliği\nSırayla: 1) Parantez içleri 2) Üslü ifadeler 3) Çarpma ve bölme 4) Toplama ve çıkarma.\n- 2 + 3 × 4 = 2 + 12 = 14 (önce çarpma!)\n- (2 + 3) × 4 = 5 × 4 = 20\n- 2 + 3 × 4 ÷ 2 = 2 + 12 ÷ 2 = 2 + 6 = 8\n## Dağılma Özelliği ve Ortak Çarpan\n- a × (b + c) = a × b + a × c\n- 6 × 8 + 6 × 2 = 6 × (8 + 2) = 6 × 10 = 60\n✏️ Çarpma işlemi toplama üzerine dağılır; ortak çarpan parantezine almak işlemi hızlandırır.",

"## Çarpan (Bölen)\nBir doğal sayıyı kalansız bölen sayılar, o sayının çarpanlarıdır.\n- 12'nin çarpanları: 1, 2, 3, 4, 6, 12 (1×12, 2×6, 3×4)\n- Çarpanlar sayıyı tam böler; en küçük çarpan 1, en büyük çarpan sayının kendisidir.\n## Katlar\nBir sayının katları, sayıyla doğal sayıların çarpımıdır.\n- 5'in katları: 5, 10, 15, 20, 25...\n- Ortak kat: İki sayının katlarında aynı olan değerler (12 ve 18'in ortak katı 36, 72...).\n## Asal Sayılar\n1 ve kendisinden başka çarpanı olmayan 1'den büyük sayılar: 2, 3, 5, 7, 11, 13, 17, 19...\n💡 2, çift olan tek asal sayıdır. 1 asal değildir.\n## Bölünebilme Kuralları\n- 2: son rakam çift (0,2,4,6,8)\n- 3: rakamlar toplamı 3'ün katı\n- 4: son iki rakam 4'ün katı\n- 5: son rakam 0 veya 5\n- 9: rakamlar toplamı 9'un katı\n- 10: son rakam 0\n✏️ Bir sayıya tam bölünme için kuralları tek tek dene; asal çarpanlara ayırmada en küçük asaldan başla.",

"## Küme Nedir?\nİyi tanımlanmış, ortak özellikli nesnelerin (elemanların) topluluğudur.\n- \"Haftanın günleri\", \"1'den 5'e kadar olan sayılar\" kümedir.\n- \"Uzun boylu öğrenciler\" küme değildir (uzunluk kişiye göre değişir).\n## Gösterimler\n- Liste yöntemi: A = {1, 2, 3}\n- Ortak özellik yöntemi: A = {0, 1, 2, 3} → \"4'ten küçük doğal sayılar\"\n- Venn şeması: Elemanlar kapalı bir eğri (genelde daire) içine yazılır.\n## Eleman Kavramı\nEleman kümenin içindeki her bir nesnedir.\n- ∈ : elemanıdır (3 ∈ A)\n- ∉ : elemanı değildir (5 ∉ A)\n- Eleman sayısı s(A) veya n(A) ile gösterilir.\n## Özel Kümeler\n- Boş küme (∅ veya {}): hiç elemanı olmayan küme. s(∅) = 0\n- Evrensel küme: üzerinde çalışılan bütün elemanları içerir.\n- Eşit kümeler: elemanları aynı olan kümeler (sıra önemli değil).\n✏️ \"Sınıfımızdaki\" ifadeleri her zaman küme değildir; özellik iyi tanımlı olmalıdır.",

"## Tam Sayılar\nNegatif tam sayılar, 0 ve pozitif tam sayıların tümü: ..., -3, -2, -1, 0, 1, 2, 3, ...\n- Pozitif: 0'dan büyük (+)\n- Negatif: 0'dan küçük (−)\n- 0, ne pozitif ne negatiftir; doğal sayıdır.\n## Sayı Doğrusu\nSağa doğru büyür, sola doğru küçülür. Negatifler 0'ın solunda, pozitifler sağındadır.\n- Sıralama: −3 < −1 < 0 < 2 < 5\n## Mutlak Değer\nSayının 0'a olan uzaklığıdır; her zaman pozitif ya da 0'dır.\n- |−7| = 7, |7| = 7, |0| = 0\n💡 Mutlak değer işaretinin içi negatif olsa da sonuç pozitiftir.\n## Tam Sayılarla İşlemler\n- Aynı işaretlileri topla, işareti koy: (−5) + (−3) = −8\n- Zıt işaretlilerde büyükten küçüğü çıkar, büyüğün işaretini koy: (−5) + 3 = −2\n- Çıkarma: işareti değiştirip topla: (−5) − (−3) = (−5) + 3 = −2\n- Çarpma/bölme: aynı işaret → pozitif, zıt işaret → negatif: (−2) × (−3) = 6, (−6) ÷ 2 = −3\n✏️ İki negatif sayının çarpımı pozitiftir; tek negatif varsa sonuç negatiftir.",
